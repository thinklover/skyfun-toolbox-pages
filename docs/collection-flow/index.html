<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>催收解約專區｜完整 SOP｜星鴻社宅工具箱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #192437;
      --navy-mid: #243556;
      --blue: #1d4ed8;
      --blue-soft: #eef2ff;
      --gold: #c9a227;
      --gold-bright: #fac02d;
      --gold-bg: #f8f1e3;
      --gold-bd: #e0c9a4;
      --cream: #f7f3ec;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e5e0d6;
      --card: #fff;
      --accent: #c9a227;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --danger-bd: #fecaca;
      --focus-bg: #fff8e8;
      --focus-bd: #e0c9a4;
      --focus-text: #8a6418;
      --shadow-sm: 0 4px 12px rgba(25, 36, 55, 0.06);
      --shadow-md: 0 8px 22px rgba(25, 36, 55, 0.1);
      --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      --font-display: var(--font);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--ink);
      background: linear-gradient(180deg, #e8eef7 0%, #f7f3ec 45%, #eef2f7 100%);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .wrap {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 14px 28px;
      min-width: 0;
      overflow-x: clip;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; flex-wrap: wrap; margin-bottom: 8px;
    }
    .back {
      display: inline-flex; align-items: center; gap: 6px;
      margin-bottom: 0; padding: 6px 12px; border-radius: 999px;
      border: 1px solid var(--line); background: #fff; color: var(--ink);
      text-decoration: none; font-weight: 700; font-size: 13px;
    }
    .sys-open {
      display: inline-flex; align-items: center; gap: 8px;
      margin-left: auto; padding: 9px 16px; border-radius: 999px;
      background: var(--navy); color: #fff;
      text-decoration: none; font-weight: 900; font-size: 14px;
      border: 1.5px solid var(--gold);
      box-shadow: 0 4px 12px rgba(25, 36, 55, 0.18);
      white-space: nowrap;
    }
    .sys-open:hover { background: #243556; }
    .sys-open .sys-ico {
      width: 18px; height: 18px; border-radius: 4px;
      background: var(--gold); color: var(--navy);
      display: grid; place-items: center;
      font-size: 11px; font-weight: 900; line-height: 1;
    }
    .guide .sys-open {
      margin: 8px 0 0; width: fit-content; margin-left: 0;
      padding: 7px 12px; font-size: 13px;
    }
    .guide-head {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 10px;
    }
    .guide-head h3 { margin: 0; }
    .guide-head .sys-open { margin: 0; }

    .poster {
      background: #fff;
      border: 1px solid #d7deea;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(25, 36, 55, 0.1);
      overflow: hidden;
      max-width: 100%;
    }
    .head {
      display: grid;
      grid-template-columns: minmax(140px, 1fr) auto minmax(120px, 1fr);
      gap: 8px; align-items: center;
      padding: 14px 18px 12px;
      background: linear-gradient(180deg, #fffdf8, #fff);
      border-bottom: 3px solid var(--navy);
      box-shadow: inset 0 -2px 0 var(--gold);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 96px; height: 60px; border-radius: 10px;
      background: #192437;
      border: 1px solid var(--gold);
      box-shadow: 0 2px 10px rgba(25, 36, 55, 0.16);
      display: grid; place-items: center;
      overflow: hidden; flex-shrink: 0;
      padding: 5px 8px;
    }
    .logo img {
      width: 100%; height: 100%; object-fit: contain; display: block;
    }
    .brand strong { display: block; font-size: 12px; color: var(--navy); letter-spacing: 0.04em; }
    .brand em { display: block; font-style: normal; font-size: 10px; color: var(--gold); font-weight: 700; }
    .center { text-align: center; }
    .center .eyebrow { font-size: 10px; font-weight: 800; color: var(--gold); letter-spacing: 0.12em; }
    .center h1 {
      margin: 2px 0 0; font-size: 1.65rem;
      color: var(--navy); letter-spacing: 0.06em; font-weight: 900;
    }
    .ttl .day, .ttl .act, .detail-bar h2, .pnode-btn .ttl {
      font-weight: 900;
    }
    .center .sop { margin: 2px 0 0; font-size: 12px; font-weight: 800; color: var(--navy); }
    .center .sub { margin: 2px 0 0; font-size: 11px; color: var(--muted); }
    .right { text-align: right; font-size: 11px; font-weight: 700; color: var(--muted); line-height: 1.4; }

    .hint {
      margin: 10px 14px 0; padding: 9px 14px; border-radius: 10px;
      background: var(--gold-bg); color: #7a5814;
      font-size: 15px; font-weight: 700;
      border: 1px solid var(--gold-bd);
    }

    .flow {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      grid-auto-rows: 1fr;
      gap: 0; padding: 12px 10px 14px; align-items: stretch;
      min-height: 420px;
    }
    .poster:has(.detail-slot:not(:empty)) .flow {
      padding-bottom: 8px;
      border-bottom: 2px solid var(--gold-bd);
      background: linear-gradient(180deg, transparent 70%, rgba(248, 241, 227, 0.45));
    }
    .cell {
      display: flex; align-items: stretch; min-width: 0; min-height: 100%;
    }
    .arrow {
      flex: 0 0 12px; align-self: center; width: 12px; color: var(--gold);
      font-size: 16px; font-weight: 900; text-align: center; user-select: none;
    }

    .card {
      appearance: none; flex: 1 1 auto; width: 100%; min-width: 0;
      min-height: 100%; margin: 0; padding: 0;
      font: inherit; color: inherit; text-align: left; cursor: pointer;
      background: var(--card); border: 1.5px solid #d7deea; border-radius: 12px;
      overflow: hidden; box-shadow: 0 4px 12px rgba(25, 36, 55, 0.06);
      display: flex; flex-direction: column;
    }
    .card:hover { border-color: var(--gold-bd); }
    .card.is-on {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(201, 162, 39, 0.28);
    }

    .node {
      flex: 0 0 auto;
      padding: 12px 8px 8px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .num {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--navy); color: #fff;
      display: grid; place-items: center; font-weight: 900; font-size: 14px;
    }
    .card.is-on .num { background: var(--gold); color: #192437; }
    .ttl { text-align: center; line-height: 1.35; min-height: 3.4em; }
    .ttl .day { display: block; font-size: 16.5px; font-weight: 900; color: var(--gold); }
    .ttl .act {
      display: block;
      font-size: 14.5px;
      font-weight: 900; color: var(--navy); margin-top: 3px;
    }
    .art {
      width: 76px; height: 76px; border-radius: 50%;
      background: linear-gradient(145deg, #fffdf8, var(--gold-bg));
      border: 1px solid var(--gold-bd);
      display: grid; place-items: center; overflow: hidden;
    }
    .art svg { width: 58px; height: 58px; display: block; }

    .body {
      flex: 1 1 auto; padding: 8px 12px 6px;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .body ul {
      margin: 0; padding: 0 0 0 1.15em;
      font-size: 13.5px; color: #374151; line-height: 1.55; font-weight: 600;
      min-height: 6.6em;
    }
    .body li { margin: 0 0 6px; min-height: 1.45em; }
    .body li:last-child { margin-bottom: 0; }

    .card-foot {
      flex: 0 0 auto;
      margin-top: 0;
      padding: 4px 12px 12px;
      width: 100%;
    }
    .focus-wrap {
      flex: 0 0 auto;
      margin: auto 10px 8px;
      padding: 10px 8px 8px;
      align-self: stretch;
      box-sizing: border-box;
      width: calc(100% - 20px);
      text-align: center;
      min-height: 5.4em;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
      border: 1px solid #d7deea;
      border-radius: 10px;
      background: #f4f7fb;
    }
    .focus-pill {
      display: inline-block;
      margin: 0 0 4px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.2;
      order: 1;
    }
    .focus {
      margin: 0;
      padding: 0;
      background: none;
      border: 0;
      color: var(--navy);
      font-size: 14.5px;
      font-weight: 900;
      text-align: center;
      line-height: 1.3;
      min-height: 2.7em;
      height: 2.7em;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      width: 100%;
      order: 2;
    }
    .focus .fl {
      display: block;
      width: 100%;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--navy);
      padding: 0 2px;
      line-height: 1.3;
      height: 1.3em;
      box-sizing: border-box;
    }
    @media (max-width: 1100px) {
      .focus { height: auto; min-height: 2.7em; }
      .focus .fl { white-space: normal; height: auto; min-height: 1.3em; }
    }
    .tap {
      margin: 0; text-align: center;
      font-size: 13px; font-weight: 800; color: #8a6418;
      height: 1.4em;
      line-height: 1.4em;
    }
    .common-block[hidden] { display: none !important; }
    .mf-goals-hero {
      margin: 0 0 14px; padding: 16px 14px 14px;
      border-radius: 18px;
      border: 2px solid var(--gold);
      background: linear-gradient(180deg, #FFF8E8 0%, #fff 70%);
      box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.12), var(--shadow-sm);
    }
    .mf-goals-hero .mf-goals-label {
      margin: 0 0 10px; text-align: center;
      font-size: 13px; font-weight: 700; color: var(--gold);
      letter-spacing: 0.08em;
    }
    .mf-goals-hero .mf-goals-title {
      margin: 0 0 12px; text-align: center;
      font-size: 1.35rem; font-weight: 800; color: var(--navy);
      letter-spacing: -0.02em; line-height: 1.25;
    }
    .mf-goals-hero .mf-goals-grid {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;
    }
    @media (max-width: 720px) {
      .mf-goals-hero .mf-goals-grid { grid-template-columns: 1fr; }
    }
    .mf-goals-hero .mf-goal {
      margin: 0; padding: 14px 12px;
      border-radius: 14px; background: #fff;
      border: 1px solid rgba(201,168,76,0.35);
      text-align: center;
    }
    .mf-goals-hero .mf-goal .n {
      display: inline-grid; place-items: center;
      width: 28px; height: 28px; border-radius: 9px; margin-bottom: 6px;
      background: var(--navy); color: var(--gold-bright);
      font-family: var(--font-display); font-size: 14px; font-weight: 700;
    }
    .mf-goals-hero .mf-goal strong {
      display: block; font-size: 17px; font-weight: 800; color: var(--navy);
      letter-spacing: -0.02em; line-height: 1.3;
    }
    .mf-goals-hero .mf-goal span {
      display: block; margin-top: 4px;
      font-size: 13px; font-weight: 500; color: var(--muted); line-height: 1.4;
    }
    .mf-goals-hero .mf-goal ul {
      margin: 8px 0 0; padding: 0 0 0 1.1em;
      text-align: left; list-style: disc;
      font-size: 12.5px; font-weight: 600; color: var(--ink); line-height: 1.5;
    }
    .mf-goals-hero .mf-goal li + li { margin-top: 3px; }

    .detail-slot {
      margin: 0 14px 4px;
      min-height: 0;
      min-width: 0;
      max-width: 100%;
      width: auto;
      box-sizing: border-box;
    }
    .detail-slot:not(:empty) {
      margin: 0 14px 16px;
      padding: 0 0 4px;
      display: grid;
      gap: 12px;
    }
    .detail-split {
      display: flex; align-items: center; gap: 12px;
      margin: 4px 0 2px;
    }
    .detail-split::before,
    .detail-split::after {
      content: '';
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-bd) 15%, var(--gold) 50%, var(--gold-bd) 85%, transparent);
    }
    .detail-split span {
      flex: 0 0 auto;
      padding: 5px 14px;
      border-radius: 999px;
      background: #fff;
      color: var(--navy);
      font-size: 13px; font-weight: 900;
      letter-spacing: 0.04em;
      border: 1.5px solid var(--gold);
      box-shadow: 0 2px 8px rgba(25, 36, 55, 0.08);
    }
    .detail {
      display: none;
      background: #fff;
      border: 1.5px solid var(--navy);
      border-top: 3px solid var(--gold);
      border-radius: 12px;
      overflow: hidden;
      max-width: 100%;
      min-width: 0;
      box-shadow: 0 8px 22px rgba(25, 36, 55, 0.1);
    }
    .detail.is-open { display: block; }

    .detail-bar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 14px;
      background: linear-gradient(180deg, #fffdf8, #fff);
      border-bottom: 1px solid var(--gold-bd);
    }
    .detail-bar .tag {
      display: inline-flex; padding: 3px 11px; border-radius: 999px;
      background: var(--navy); color: var(--gold-bright); font-size: 14px; font-weight: 800;
    }
    .detail-bar .mini-art {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--gold-bg); border: 1px solid var(--gold-bd);
      display: grid; place-items: center; flex-shrink: 0;
    }
    .detail-bar .mini-art svg { width: 34px; height: 34px; }
    .detail-bar h2 {
      margin: 0; flex: 1; min-width: 180px;
      font-size: 1.2rem; font-weight: 900; line-height: 1.3;
    }
    .detail-bar h2 .day { color: var(--gold); margin-right: 8px; }
    .detail-bar h2 .act { color: var(--navy); }
    .detail-bar .close-btn {
      margin-left: auto;
      appearance: none; border: 1px solid var(--line); background: #fff;
      border-radius: 999px; padding: 6px 14px;
      font: inherit; font-size: 14px; font-weight: 800; color: #475569; cursor: pointer;
    }

    .detail-body {
      padding: 12px 14px 14px;
      display: grid; gap: 12px;
      min-width: 0; max-width: 100%;
    }

    .when {
      margin: 0; padding: 10px 12px; border-radius: 8px;
      background: var(--gold-bg); border: 1px solid var(--gold-bd);
      color: #7a5814; font-size: 16px; font-weight: 700;
    }
    .when b { color: #8a6418; }

    .flow-hint {
      margin: 0; font-size: 14px; font-weight: 700; color: #8a6418;
    }

    .pflow {
      display: flex; align-items: stretch; gap: 0;
      overflow-x: auto; padding: 2px 0 4px;
    }
    .pflow.is-wide .pnode { min-width: 0; }
    .pnode {
      flex: 1 1 0; min-width: 140px;
      display: flex; align-items: stretch; gap: 0;
    }
    .pnode-btn {
      appearance: none; width: 100%; margin: 0;
      padding: 18px 14px;
      font: inherit; text-align: center; cursor: pointer;
      background: #f8fafc; border: 2px solid #d7deea; border-radius: 14px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; min-height: 112px;
      transition: border-color 0.12s, box-shadow 0.12s, background 0.12s;
    }
    .pnode-btn:hover { border-color: #94a3b8; }
    .pnode-btn.is-on {
      border-color: var(--gold);
      background: var(--gold-bg);
      box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.22);
    }
    .pnode-btn .sn {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--navy); color: #fff;
      display: grid; place-items: center;
      font-size: 20px; font-weight: 900; flex-shrink: 0;
    }
    .pnode-btn.is-on .sn { background: var(--gold); color: #192437; }
    .pnode-btn .ttl {
      margin: 0; font-size: 17px; font-weight: 900; color: var(--navy);
      line-height: 1.3; min-height: 0; width: 100%;
      text-align: center;
    }
    .pnode-btn .ttl .tl { display: block; }
    .pnode-btn .tap-mini {
      display: block; margin: 0;
      font-size: 12px; font-weight: 700; color: #8a6418;
    }
    .parrow {
      flex: 0 0 28px; align-self: center;
      color: var(--gold); font-size: 26px; font-weight: 900; text-align: center;
      user-select: none;
    }

    .pdetail {
      display: none;
      padding: 12px 14px;
      border: 1.5px solid var(--gold-bd);
      border-radius: 12px;
      background: #fffdf8;
    }
    .pdetail.is-open { display: grid; gap: 10px; }
    .pdetail .why {
      margin: 0; font-size: 16px; font-weight: 600; color: #334155; line-height: 1.55;
    }
    .pdetail .why b { color: var(--navy); }
    .pdetail .step-focus {
      margin: 0; padding: 10px 12px;
      position: relative;
      background: #FFF7F7;
      border: 1px solid #FECACA; border-radius: 12px;
      color: #B91C1C; font-size: 16px; font-weight: 800; text-align: center;
      line-height: 1.4;
    }
    .pdetail .step-focus .fl { display: inline; color: #B91C1C; }
    .pdetail .step-focus .fl + .fl::before { content: ' · '; color: #B91C1C; }
    .pdetail .step-focus .focus-pill {
      display: inline-block; margin: 0 6px 0 0; padding: 0;
      position: static; transform: none;
      background: none; border: 0;
      color: #B91C1C; font-size: 13px; font-weight: 800;
      letter-spacing: 0.06em;
    }
    .pdetail .step-focus .focus-pill::after { content: '｜'; margin-left: 4px; color: #FCA5A5; }

    .msgbox {
      margin-top: 12px; padding: 18px 18px 16px;
      border-radius: 20px; background: #fff;
      border: 1.5px solid #c4b5fd;
      box-shadow: 0 8px 28px rgba(139, 92, 246, 0.14);
    }
    .msgbox h3 {
      margin: 0 0 10px; font-size: 1.45rem; font-weight: 900; color: var(--navy);
      letter-spacing: 0.02em; line-height: 1.3;
    }
    .msg-fields {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .msg-fields label {
      display: grid; gap: 4px; font-size: 14px; font-weight: 700; color: #334155;
    }
    .msg-fields label.full { grid-column: 1 / -1; }
    .msg-fields input, .msg-fields select {
      width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px;
      font: inherit; font-size: 15px; background: #fff;
    }
    #cf-id { text-transform: uppercase; }
    .msg-actions {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
    }
    .msg-actions button {
      appearance: none; border: none; border-radius: 12px; padding: 10px 16px;
      font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
      background: var(--navy); color: #fff;
    }
    .msg-actions button.soft {
      background: #F2F2F7; color: var(--blue); border: 1px solid var(--line);
    }
    .msgbox textarea {
      width: 100%; margin-top: 10px; min-height: 160px;
      padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px;
      font: inherit; font-size: 15px; line-height: 1.5; resize: vertical;
    }
    .msg-status { margin: 6px 0 0; font-size: 13px; font-weight: 700; color: #047857; min-height: 1.2em; }

    .plink {
      display: inline-flex; margin-top: 10px; padding: 8px 14px; border-radius: 8px;
      background: var(--navy); color: #fff; text-decoration: none;
      font-size: 15px; font-weight: 800;
    }
    .plink.soft {
      background: #fff; color: var(--navy); border: 1.5px solid #cbd5e1;
    }

    .scriptbox {
      margin-top: 4px; padding: 18px 18px 16px;
      border-radius: 20px; background: #fff;
      border: 1.5px solid #93c5fd;
      box-shadow: 0 8px 28px rgba(59, 130, 246, 0.14);
    }
    .scriptbox h3 {
      margin: 0 0 10px; font-size: 1.45rem; font-weight: 900; color: var(--navy);
      letter-spacing: 0.02em; line-height: 1.3;
    }
    .scriptbox .script-note {
      margin: 0 0 10px; font-size: 14px; font-weight: 600; color: #64748b; line-height: 1.45;
    }
    .scriptbox ol {
      margin: 0; padding: 0; list-style: none; display: grid; gap: 10px;
    }
    .scriptbox li {
      display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: start;
      font-size: 15px; font-weight: 600; color: #334155; line-height: 1.5;
    }
    .scriptbox .sn {
      width: 28px; height: 28px; border-radius: 8px;
      background: var(--navy); color: #fff;
      display: grid; place-items: center;
      font-size: 13px; font-weight: 900;
    }
    .scriptbox .say {

      function focusLinesHtml(focus) {

          .map(function (s) { return s.replace(/\u3000/g, '').trim(); })
          .filter(Boolean);
        if (parts.length >= 2) {

        return '<span class="fl">' + (focus || '') + '</span>';

        return '<span class="tl">' + (title || '') + '</span>';

      function bindMsgBox() {
        var gen = document.getElementById('cf-gen');
        var copy = document.getElementById('cf-copy');
        var out = document.getElementById('cf-out');
        var status = document.getElementById('cf-status');
        if (!gen || !out) return;
        function refresh() { out.value = buildRemindText(); status.textContent = ''; }
        gen.onclick = refresh;
        ['cf-due', 'cf-id', 'cf-region'].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.addEventListener('input', refresh);
          if (el) el.addEventListener('change', refresh);
        });
        copy.onclick = function () {
          if (!out.value) refresh();
          navigator.clipboard.writeText(out.value).then(function () {
            status.textContent = '已複製，可直接貼到 LINE';
          }).catch(function () {
            out.select();
            document.execCommand('copy');
            status.textContent = '已複製，可直接貼到 LINE';
          });
        };
        refresh();
      }

      function bindFoldDeck(deckId, onToggle) {
        var deck = document.getElementById(deckId);
        if (!deck || deck.getAttribute('data-bound') === '1') return;
        deck.setAttribute('data-bound', '1');
        deck.addEventListener('click', function (e) {
          /* 展開內容內的操作不觸發收合 */
          if (e.target.closest('.lal-card-body') || e.target.closest('.lal-card-panel')) return;

          /* 上方業務操作（存證）：整卡可點、卡片內展開 */
          var inlineCard = e.target.closest('.lal-card');
          if (inlineCard && deck.contains(inlineCard) && !inlineCard.classList.contains('lal-card-face')) {
            var sumInline = inlineCard.querySelector('.lal-card-sum');
            var openInline = inlineCard.classList.toggle('is-open');
            if (sumInline) sumInline.setAttribute('aria-expanded', openInline ? 'true' : 'false');
            return;
          }

          /* 左右卡片：整卡可點，內容在下方全寬；互斥展開 */
          var face = e.target.closest('.lal-card-face');
          if (!face || !deck.contains(face)) return;
          var kind = face.getAttribute('data-lal-card');
          var panel = deck.querySelector('.lal-card-panel[data-lal-panel="' + kind + '"]');
          if (!kind || !panel) return;
          var open = !panel.classList.contains('is-open');
          deck.querySelectorAll('.lal-card-face[data-lal-card]').forEach(function (f) {
            var k = f.getAttribute('data-lal-card');
            var on = open && k === kind;
            f.classList.toggle('is-open', on);
            var btn = f.querySelector('.lal-card-sum');
            if (btn) btn.setAttribute('aria-expanded', on ? 'true' : 'false');
          });
          deck.querySelectorAll('.lal-card-panel[data-lal-panel]').forEach(function (p) {
            p.classList.toggle('is-open', open && p.getAttribute('data-lal-panel') === kind);
          });
          if (open && typeof onToggle === 'function') onToggle(kind);
        });
      }

      function showNoteRulingStep(idx) {
        var panel = document.getElementById('nr-step-detail');
        var chart = document.getElementById('nr-chart');
        if (!panel || !chart) return;
        var buttons = chart.querySelectorAll('.nr-step-btn');
        if (noteRulingOpen === idx) {
          noteRulingOpen = null;
          buttons.forEach(function (btn) {
            btn.classList.remove('is-on');
            btn.setAttribute('aria-expanded', 'false');
          });
          panel.classList.remove('is-open');
          panel.hidden = true;
          panel.innerHTML = '';
          return;
        }
        noteRulingOpen = idx;
        buttons.forEach(function (btn) {
          var on = Number(btn.getAttribute('data-nr')) === idx;
          btn.classList.toggle('is-on', on);
          btn.setAttribute('aria-expanded', on ? 'true' : 'false');
        });
        panel.innerHTML = noteRulingStepHtml(idx);
        panel.hidden = false;
        panel.classList.add('is-open');
        var innerDeck = document.getElementById('nr-inner-deck');
        if (innerDeck) {
          innerDeck.removeAttribute('data-bound');
          bindFoldDeck('nr-inner-deck', function (kind) {
            if (kind === 'nr-gen' && typeof window.initNoteRulingPetition === 'function') {
              setTimeout(function () { window.initNoteRulingPetition(); }, 0);
            }
            if (kind === 'nr-poa' && typeof window.initHouseholdPoa === 'function') {
              setTimeout(function () { window.initHouseholdPoa(); }, 0);
            }
            if (kind === 'nr-csp' && typeof window.initCivilSupplementPetition === 'function') {
              setTimeout(function () { window.initCivilSupplementPetition(); }, 0);
            }
          });
        }
        if (idx === 0 && typeof window.initNoteRulingPetition === 'function') {
          window.initNoteRulingPetition();
        }
        if (idx === 1 && typeof window.initHouseholdPoa === 'function') {
          window.initHouseholdPoa();
        }
        if (idx === 2 && typeof window.initCivilSupplementPetition === 'function') {
          /* 產生器在右卡面板內，展開時再 init；先試一次若已在 DOM */
          window.initCivilSupplementPetition();
        }
        if (idx === 4) {
          var go6 = document.getElementById('nr-btn-go-stage6');
          if (go6) {
            go6.onclick = function () {
              setOpen(6);
            };
          }
        }
      }

      function bindNoteRulingSteps() {

        chart.setAttribute('data-bound', '1');

          if (!btn || !chart.contains(btn)) return;
          keepView(function () { showNoteRulingStep(Number(btn.getAttribute('data-nr'))); });

      function openMediationDoc(key) {
        var preview = document.getElementById('mf-doc-preview');
        var titleEl = document.getElementById('mf-doc-preview-title');
        var body = document.getElementById('mf-doc-preview-body');
        var ext = document.getElementById('mf-doc-preview-ext');
        var closeBtn = document.getElementById('mf-doc-preview-close');
        if (!preview || !body) return;

        if (preview.getAttribute('data-key') === key && !preview.hidden) {
          closeMediationDocPreview();
          return;
        }

        document.querySelectorAll('.mf-doc[data-mdoc]').forEach(function (b) {
          b.classList.toggle('is-on', b.getAttribute('data-mdoc') === key);
        });

        if (titleEl) titleEl.textContent = MEDIATION_DOC_LABELS[key] || '文件預覽';
        preview.setAttribute('data-key', key);
        preview.hidden = false;

        if (key === 'id-hint') {
          if (ext) ext.hidden = true;
          body.innerHTML = '<div class="mf-doc-note">負責人身分證影本請洽<strong>各地區協理</strong>取得。</div>';
        } else if (key === 'power-of-attorney' || key === 'legal-rep-attorney') {
          closeMediationDocPreview();
          return;
        } else {
          var url = MEDIATION_DOC_URLS[key];
          if (!url) return;
          if (ext) { ext.hidden = false; ext.href = url; }
          body.innerHTML = '<iframe class="mf-doc-frame" src="' + url + '#view=FitH" title="文件預覽"></iframe>';
        }

        if (closeBtn) closeBtn.onclick = closeMediationDocPreview;
      }

      function bindMediationSteps() {
        mediationOpen = null;
        mfGoalOpen = null;
        var chart = document.getElementById('mf-chart');
        if (!chart || chart.getAttribute('data-bound') === '1') return;
        chart.setAttribute('data-bound', '1');
        chart.addEventListener('click', function (e) {
          var goal = e.target.closest('[data-mf-goal]');
          if (goal && chart.contains(goal)) {
            keepView(function () { showMfGoal(Number(goal.getAttribute('data-mf-goal'))); });
            return;
          }
          var doc = e.target.closest('[data-mdoc]');
          if (doc && chart.contains(doc)) {
            keepView(function () { openMediationDoc(doc.getAttribute('data-mdoc')); });
            return;
          }
          var btn = e.target.closest('.nr-step-btn');
          if (!btn || !chart.contains(btn)) return;
          keepView(function () { showMediationStep(Number(btn.getAttribute('data-mf'))); });
        });
      }

      function showEnforceStep(idx) {
        var panel = document.getElementById('ef-step-detail');
        var chart = document.getElementById('ef-chart');
        if (!panel || !chart) return;
        var buttons = chart.querySelectorAll('.nr-step-btn');
        if (enforceOpen === idx) {
          enforceOpen = null;
          buttons.forEach(function (btn) {
            btn.classList.remove('is-on');
            btn.setAttribute('aria-expanded', 'false');
          });
          panel.classList.remove('is-open');
          panel.hidden = true;
          panel.innerHTML = '';
          return;
        }
        enforceOpen = idx;
        buttons.forEach(function (btn) {
          var on = Number(btn.getAttribute('data-ef')) === idx;
          btn.classList.toggle('is-on', on);
          btn.setAttribute('aria-expanded', on ? 'true' : 'false');
        });
        panel.innerHTML = enforceStepHtml(idx);
        panel.hidden = false;
        panel.classList.add('is-open');
        if (idx === 0 && typeof window.initEnforcementPetition === 'function') {
          setTimeout(function () { window.initEnforcementPetition(); }, 0);
        }
        if (idx === 2 && typeof window.initEnforcementCourtLookup === 'function') {
          setTimeout(function () { window.initEnforcementCourtLookup(); }, 0);
        }
      }

          var btn = e.target.closest('.nr-step-btn');
          if (!btn || !chart.contains(btn)) return;
          keepView(function () { showEnforceStep(Number(btn.getAttribute('data-ef'))); });
        });
      }

      function showStep(s, idx) {
        stepOpen = idx;
        var panel = document.getElementById('step-detail');
        var steps = s.process;
        slot.querySelectorAll('.pnode-btn').forEach(function (btn) {
          var on = Number(btn.dataset.step) === idx;
          btn.classList.toggle('is-on', on);
          btn.setAttribute('aria-expanded', on ? 'true' : 'false');
        });
        if (idx == null || !panel) {
          if (panel) {
            panel.classList.remove('is-open');
            panel.hidden = true;
            panel.innerHTML = '';
          }
          var stageFocus = slot.querySelector('.focus-lg');
          if (stageFocus) stageFocus.hidden = false;
          return;
        }
        var p = steps[idx];
        var extra = '';
        if (p.msgTpl) extra = renderMsgBox();
        else if (p.talkScript) extra = renderTalkScript();
        else if (p.visitScript) extra = renderVisitScript();
        else if (p.postLineTpl) extra = renderPostLineTip();
        else if (p.lalGuide) extra = renderLalGuide();
        else if (p.lalTrack) extra = renderLalTrack();
        else if (p.agreeScript) extra = renderAgreeScript();
        else if (p.noteScript) extra = renderNoteScript();
        else if (p.noteRuling) extra = renderNoteRulingFlow();
        else if (p.mediatePrep) extra = renderMediatePrep();
        else if (p.mediateScript) extra = renderMediateScript();
        else if (p.recordGuideVisit) extra = renderRecordGuideVisit();
        else if (p.recordGuideLetter) extra = renderRecordGuideLetter();
        else if (p.recordGuide) extra = renderRecordGuide();
        else if (p.link) {
          extra = '<a class="plink' + (p.link.soft ? ' soft' : '') + '" href="' + p.link.href + '">' + p.link.label + '</a>';
        }
        var focusHtml = p.focus
          ? '<div class="step-focus"><span class="focus-pill">重點</span>' + focusLinesHtml(p.focus) + '</div>'
          : '';
        panel.innerHTML = (p.why ? '<p class="why">' + p.why + '</p>' : '') + focusHtml + extra;
        panel.hidden = false;
        panel.classList.add('is-open');
        if (p.msgTpl) bindMsgBox();
        if (p.postLineTpl) bindPostLineTip();
        if (p.visitScript) {
          bindVisitFoldCards();
          /* 產生器在右卡面板內：展開時再 init；此處先試綁一次 */
          if (typeof window.initCareVisitNotice === 'function') {
            setTimeout(function () { window.initCareVisitNotice(); }, 0);
          }
        }
        if (p.lalGuide) {
          bindLalFoldCards();
          if (typeof window.initLalGenerator === 'function') window.initLalGenerator();
        }
        if (p.noteScript || p.noteRuling) bindNoteRulingSteps();
        var stageFocus = slot.querySelector('.focus-lg');
        if (stageFocus) stageFocus.hidden = true;
      }

      }

      /** 展開／收合時鎖住捲動，避免畫面跳來跳去 */
      function keepView(fn) {
        var y = window.scrollY;
        fn();
        requestAnimationFrame(function () {
          if (Math.abs(window.scrollY - y) > 1) window.scrollTo(0, y);
          if (typeof window.skyfunCfPostHeight === 'function') window.skyfunCfPostHeight();
        });
      }

      function setOpen(n) {
        open = n;
        stepOpen = null;
        flow.querySelectorAll('.card').forEach(function (btn) {
          var on = Number(btn.dataset.n) === open;
          btn.classList.toggle('is-on', on);
          btn.setAttribute('aria-expanded', on ? 'true' : 'false');
        });
        if (open == null) {
          slot.innerHTML = '';
          return;
        }
        var s = STEPS.find(function (x) { return x.n === open; });
        slot.innerHTML = renderDetail(s);
        slot.querySelector('[data-close]').onclick = function () { keepView(function () { setOpen(null); }); };
        var pflow = slot.querySelector('.pflow');
        if (pflow) {
          pflow.addEventListener('click', function (e) {
            var btn = e.target.closest('.pnode-btn');
            if (!btn) return;
            var idx = Number(btn.dataset.step);
            keepView(function () { showStep(s, stepOpen === idx ? null : idx); });
          });
        }
        if (s.directMediationFlow) bindMediationSteps();
        if (s.directNoteRuling) bindNoteRulingSteps();
        if (s.directEnforceFlow) bindEnforceSteps();
      }

      flow.innerHTML = STEPS.map(function (s, i) {
        var card =
          '<button type="button" class="card" role="listitem" data-n="' + s.n + '" aria-expanded="false">' +
            '<div class="node">' +
              '<span class="num">' + s.n + '</span>' +
              '<div class="ttl"><span class="day">' + s.day + '</span><span class="act">' + s.act + '</span></div>' +
              '<div class="art">' + ICONS[s.n] + '</div>' +
            '</div>' +
            '<div class="body">' +
              '<ul>' + s.items.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>' +
            '</div>' +
            '<div class="focus-wrap"><span class="focus-pill">重點</span><p class="focus">' + focusLinesHtml(s.focus) + '</p></div>' +
            '<div class="card-foot">' +
              '<p class="tap">點擊看怎麼做</p>' +
            '</div>' +
          '</button>';
        var arrow = i < STEPS.length - 1 ? '<div class="arrow" aria-hidden="true">›</div>' : '';
        return '<div class="cell" data-n="' + s.n + '">' + card + arrow + '</div>';
      }).join('');

      flow.addEventListener('click', function (e) {
        var btn = e.target.closest('.card');
        if (!btn) return;
        var n = Number(btn.dataset.n);
        keepView(function () { setOpen(open === n ? null : n); });
      });

      var _setOpen = setOpen;
      setOpen = function (n) {
        keepView(function () { _setOpen(n); });
      };

      /** 從催收解約專區深連結：#stage-4、#stage-4-petition、#stage-4-poa … */
      function applyHash() {
        var h = (location.hash || '').replace(/^#/, '');
        if (!h) return;
        var m = h.match(/^stage-([1-6])(?:-(petition|poa))?$/);
        if (!m) return;
        var n = Number(m[1]);
        setOpen(n);
        if (n === 4 && m[2]) {
          var sub = m[2] === 'poa' ? 0 : 1;
          setTimeout(function () {
            mediationOpen = null;
            showMediationStep(sub);
          }, 80);
        }
      }
      applyHash();
      window.addEventListener('hashchange', applyHash);
    })();
  </script>
</body>
</html>
