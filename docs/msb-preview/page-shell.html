            <div class="msb-app" id="msb-app">

                            <button type="button" id="msb-export" class="msb-btn msb-btn--ghost">匯出</button>
                            <button type="button" id="msb-open-add" class="msb-btn msb-btn--primary msb-edit-only">＋ 加減分</button>

                    </div>
                    <div id="msb-self" class="msb-self" hidden></div>
                    <div class="msb-table-wrap">

                                <tr>
                                    <th>部別</th>
                                    <th>姓名</th>
                                    <th class="num">分數</th>
                                    <th class="num">獎金</th>

                                </tr>
                            </thead>
                            <tbody id="msb-people-body"></tbody>
                        </table>
                    </div>
                    <p id="msb-score-month-note" class="msb-filter-note"></p>
                </section>

                <section class="msb-panel" data-msb-panel="records" hidden>
                    <div class="msb-head-row">
                        <h2 class="msb-page-title">加減分紀錄</h2>
                        <div class="msb-head-tools">
                            <div class="msb-board-tabs" role="tablist" aria-label="計分表">

                                <button type="button" data-msb-board="monthly">月會主管</button>
                            </div>
                            <button type="button" id="msb-export-records" class="msb-btn msb-btn--ghost">匯出</button>
                            <button type="button" id="msb-open-add-2" class="msb-btn msb-btn--primary msb-edit-only">＋ 加減分</button>
                        </div>
                    </div>
                    <div class="msb-filters">
                        <input id="msb-q" type="search" placeholder="搜尋人員／項目／備註" aria-label="搜尋">
                        <select id="msb-filter-project" aria-label="專案篩選"></select>
                        <input id="msb-date-from" type="date" aria-label="起始日期">
                        <input id="msb-date-to" type="date" aria-label="結束日期">

                            <button type="button" class="is-on" data-msb-board="system">系統會議</button>
                            <button type="button" data-msb-board="monthly">月會主管</button>

                    <div id="msb-settings-lock" class="msb-settings-lock">

                            <label for="msb-settings-pwd">密碼</label>
                            <div class="msb-settings-gate-row">
                                <input id="msb-settings-pwd" type="password" inputmode="numeric" required placeholder="請輸入密碼" autocomplete="current-password">
                                <button type="submit" class="msb-btn msb-btn--primary">解鎖</button>
                            </div>

                                </div>
                                <div id="msb-projects-list"></div>
                            </div>
                        </div>
                    </div>
                </section>

            <div class="msb-modal" id="msb-modal" hidden>

                    <div class="msb-modal-head">
                        <div>
                            <h3 id="msb-form-title">加減分</h3>
                            <p id="msb-modal-board" class="msb-modal-board">系統會議</p>
                        </div>
                        <button type="button" class="msb-modal-x" data-msb-close="1" aria-label="關閉">×</button>
                    </div>
                    <form id="msb-entry-form" class="msb-form" autocomplete="off">
                        <div class="msb-form-grid">
                            <div class="msb-field">
                                <label class="msb-req" for="msb-person">人員</label>
                                <select id="msb-person" required></select>
                            </div>
                            <div class="msb-field">
                                <label class="msb-req" for="msb-project">專案／區塊</label>
                                <select id="msb-project" required></select>
                            </div>
                            <div class="msb-field">
                                <label class="msb-req" for="msb-date">日期</label>
                                <input id="msb-date" type="date" required>
                            </div>
                            <div class="msb-field">
                                <label class="msb-req" for="msb-score">分數（減分用負數）</label>
                                <input id="msb-score" type="number" step="0.01" required placeholder="例 6 或 -2">
                            </div>
                            <div class="msb-field" id="msb-session-wrap" hidden>
                                <label for="msb-session">月會場次</label>
                                <input id="msb-session" type="text" maxlength="40" placeholder="例：11 月月會">
                            </div>
                            <div class="msb-field">
                                <label class="msb-req" for="msb-item">項目</label>
                                <input id="msb-item" type="text" maxlength="80" required placeholder="例：會議提案">
                            </div>
                            <div class="msb-field msb-field--full">
                                <label for="msb-note">備註</label>
                                <textarea id="msb-note" maxlength="500" rows="2" placeholder="選填"></textarea>
                            </div>
                        </div>
                        <p id="msb-form-msg" class="msb-msg" role="status"></p>
                        <div class="msb-modal-actions">
                            <button type="button" class="msb-btn msb-btn--ghost" data-msb-close="1">取消</button>
                            <button type="submit" id="msb-save" class="msb-btn msb-btn--primary">儲存</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="msb-modal" id="msb-month-modal" hidden>

                        </div>
                        <button type="button" class="msb-modal-x" data-msb-month-close="1" aria-label="關閉">×</button>

                                <label class="msb-req" for="msb-month-person">人員</label>
                                <select id="msb-month-person" required></select>
                            </div>
                            <div class="msb-field">
                                <label class="msb-req" for="msb-month-period">月份</label>
                                <input id="msb-month-period" type="month" required>

                                <label for="msb-month-score">分數</label>
                                <input id="msb-month-score" type="number" step="0.01" placeholder="可留空">
                            </div>
                            <div class="msb-field">
                                <label for="msb-month-bonus">獎金</label>
                                <input id="msb-month-bonus" type="number" min="0" step="1" placeholder="可留空">

                            <div class="msb-field">
                                <label for="msb-month-status">獎金狀態</label>
                                <select id="msb-month-status">

                            <div class="msb-field msb-field--full">

                        <p id="msb-month-msg" class="msb-msg" role="status"></p>
                        <div class="msb-modal-actions">

                            <button type="submit" id="msb-month-save" class="msb-btn msb-btn--primary">儲存</button>
                        </div>

                        <div class="msb-modal-actions">

                        </div>
                    </form>
                </div>
            </div>
