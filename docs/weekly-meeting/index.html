<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>業務周會檔案｜星鴻社宅工具箱</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #fff;
      --ink: #0f172a;
      --muted: #64748b;
      --accent: #6366f1;
      --accent-soft: #eef2ff;
      --border: #e2e8f0;
      --radius: 16px;
      --font: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      background: radial-gradient(1200px 480px at 50% -10%, #e0e7ff 0%, transparent 55%), var(--bg);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.6;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
    .top { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .back {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border);
      background: #fff; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 13px;
    }
    .back:hover { border-color: var(--accent); color: var(--accent); }
    h1 { font-size: 1.65rem; margin: 0 0 6px; letter-spacing: 0.02em; }
    .sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    .meta { font-size: 12px; color: var(--muted); margin-bottom: 24px; }
    section { margin-bottom: 28px; }
    section h2 {
      font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: var(--muted);
      margin: 0 0 10px; text-transform: none;
    }
    .list { display: grid; gap: 10px; }
    .item {
      display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
      padding: 14px 16px; background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .item:hover { border-color: #c7d2fe; box-shadow: 0 8px 24px rgba(99, 102, 241, 0.1); }
    .date {
      min-width: 72px; padding: 6px 10px; border-radius: 10px; background: var(--accent-soft);
      color: #4338ca; font-size: 12px; font-weight: 800; text-align: center; white-space: nowrap;
    }
    .item-title { font-weight: 700; font-size: 15px; }
    .item-title small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .dl {
      display: inline-flex; align-items: center; gap: 4px; padding: 8px 14px; border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; text-decoration: none;
      font-size: 13px; font-weight: 800; white-space: nowrap;
    }
    .dl:hover { filter: brightness(1.05); }
    .empty, .err { padding: 20px; text-align: center; color: var(--muted); background: #fff; border-radius: var(--radius); border: 1px dashed var(--border); }
    .note {
      margin-top: 32px; padding: 14px 16px; border-radius: var(--radius);
      background: #fffbeb; border: 1px solid #fde68a; font-size: 13px; color: #92400e;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="back" href="../../index.html">← 回首頁</a>
    </div>
    <h1>📂 業務周會檔案</h1>
    <p class="sub">管理部週會簡報與相關表單，依日期整理供業務下載。</p>
    <p class="meta" id="meta">載入中…</p>
    <div id="content"></div>
    <p class="note">每週周會後請由管理員上傳最新 PDF 至本頁。若有缺檔或連結失效，請聯繫管理部。</p>
  </div>
  <script>
    (async function () {
      const root = document.getElementById('content');
      const meta = document.getElementById('meta');
      try {
        const res = await fetch('./manifest.json?t=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        meta.textContent = '最後更新：' + (data.updatedAt || '—');
        if (!data.sections?.length) {
          root.innerHTML = '<p class="empty">尚無檔案</p>';
          return;
        }
        root.innerHTML = data.sections.map(function (sec) {
          const items = (sec.items || []).slice().sort(function (a, b) {
            return String(b.sortDate || '').localeCompare(String(a.sortDate || ''));
          });
          if (!items.length) return '';
          const rows = items.map(function (it) {
            const href = it.file || '#';
            const name = (href.split('/').pop() || 'download.pdf');
            return '<article class="item">' +
              '<span class="date">' + esc(it.dateLabel || it.sortDate || '—') + '</span>' +
              '<div class="item-title">' + esc(it.title || name) +
              (it.subtitle ? '<small>' + esc(it.subtitle).replace(/\n/g, '<br>') + '</small>' : '') + '</div>' +
              '<a class="dl" href="' + escAttr(href) + '" download="' + escAttr(name) + '" target="_blank" rel="noopener">⬇ 下載</a>' +
              '</article>';
          }).join('');
          return '<section><h2>' + esc(sec.title || '') + '</h2><div class="list">' + rows + '</div></section>';
        }).join('');
      } catch (err) {
        meta.textContent = '';
        root.innerHTML = '<p class="err">無法載入檔案清單：' + esc(String(err.message || err)) + '</p>';
      }
      function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
      function escAttr(s) { return esc(s); }
    })();
  </script>
</body>
</html>
