<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>財務部問題回報後台 — 星鴻工具箱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <link rel="stylesheet" href="../css/admin-shell.css?v=20261013-1" />
  <style>
    table { font-size: 0.85rem; }
    th, td { padding: 0.55rem 0.5rem; vertical-align: top; }
    .body { word-break: break-word; max-width: 28rem; min-width: 16rem; }
    .body-dl { display: grid; gap: 0.28rem; margin: 0; }
    .body-row { display: grid; grid-template-columns: 7.2rem minmax(0, 1fr); gap: 0.35rem 0.55rem; align-items: start; }
    .body-k { color: #64748b; font-size: 0.75rem; font-weight: 800; line-height: 1.4; }
    .body-v { color: #0f172a; font-size: 0.82rem; font-weight: 700; line-height: 1.45; white-space: pre-wrap; }
    .body-empty { color: #94a3b8; font-size: 0.8rem; }
    .atts a {
      display: inline-block; margin: 0.15rem 0.35rem 0.15rem 0;
      padding: 0.2rem 0.55rem; border-radius: 999px;
      background: #059669; color: #fff; font-size: 0.75rem; font-weight: 800;
      text-decoration: none;
    }
    .atts a:hover { background: #047857; }
    .type { font-weight: 900; color: #047857; }
    .muted { color: #64748b; font-size: 0.78rem; }
    .st { display: inline-block; padding: 0.12rem 0.45rem; border-radius: 999px; font-size: 0.72rem; font-weight: 800; }
    .st-submitted { background: #ecfdf5; color: #047857; }
    .st-processing { background: #eff6ff; color: #1d4ed8; }
    .st-closed { background: #f1f5f9; color: #475569; }
    .st-rejected { background: #fee2e2; color: #991b1b; }
    .st-resubmitted { background: #fef9c3; color: #a16207; }
    .status-filters, .type-filters { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .status-filters button, .type-filters button {
      border: 1px solid #cbd5e1; background: #fff; color: #334155;
      border-radius: 999px; padding: 0.28rem 0.75rem; font-size: 0.78rem; font-weight: 800; cursor: pointer;
    }
    .status-filters button.is-on { border-color: #059669; background: #ecfdf5; color: #047857; }
    .type-filters button.is-on { border-color: #0284c7; background: #e0f2fe; color: #0369a1; }
    .filter-label { margin: 0; font-size: 0.75rem; font-weight: 800; color: #64748b; }
    .act-box { margin-top: 0.4rem; display: grid; gap: 0.35rem; max-width: 16rem; }
    .act-row { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .act-row button {
      border: 1px solid #94a3b8; background: #fff; color: #0f172a;
      border-radius: 0.45rem; padding: 0.28rem 0.65rem; font-weight: 800; font-size: 0.78rem; cursor: pointer;
    }
    .act-row button[data-fin-status="processing"] { border-color: #3b82f6; color: #1d4ed8; }
    .act-row button[data-fin-status="closed"] { border-color: #64748b; color: #334155; }
    .act-row button:hover { background: #f8fafc; }
    .act-row button:disabled { opacity: 0.6; cursor: wait; }
    .reject-box { margin-top: 0.15rem; display: grid; gap: 0.35rem; max-width: 16rem; }
    .reject-box textarea { width: 100%; min-height: 3.2rem; border: 1px solid #fecaca; border-radius: 0.45rem; padding: 0.35rem 0.45rem; font: inherit; font-size: 0.8rem; }
    .reject-box button { border: 1px solid #dc2626; background: #fff; color: #b91c1c; border-radius: 0.45rem; padding: 0.28rem 0.7rem; font-weight: 800; font-size: 0.78rem; cursor: pointer; }
    .reject-box button:hover { background: #fef2f2; }
    .reject-box button:disabled { opacity: 0.6; cursor: wait; }
    .reject-reason { margin: 0.25rem 0 0; color: #7f1d1d; font-size: 0.8rem; white-space: pre-wrap; word-break: break-word; }
    .act-row button[data-fin-delete] { border-color: #b91c1c; color: #991b1b; background: #fff; }
    .act-row button[data-fin-delete]:hover { background: #fef2f2; }
  </style>
</head>
<body class="p-4 md:p-6 max-w-[96rem] mx-auto space-y-4">
  <header>
    <div class="topbar">
      <h1>財務部問題回報後台</h1>
      <a class="back" href="../index.html">← 回工具箱</a>
    </div>
    <p class="lead">查看財務回報單、退件、刪除案件與下載附件。下方可勾選誰要收新單 LINE 推播（須先綁定工具箱 LINE）。</p>
  </header>

  <section class="card p-4 space-y-3 max-w-xl" id="login-panel">
    <label class="block text-sm text-slate-600 font-bold">總管密碼</label>
    <div class="flex flex-wrap gap-2">
      <input type="password" id="admin-secret" placeholder="總管密碼" class="flex-1 min-w-[12rem]" />
      <button type="button" id="btn-login" class="btn btn-main">連線</button>
    </div>
    <p id="login-msg" class="text-sm err hidden"></p>
  </section>

  <section class="hidden space-y-4" id="main-panel">
    <div class="card p-4 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h2 class="text-base font-extrabold text-slate-800 m-0">LINE 通知對象</h2>
        <button type="button" id="btn-line-refresh" class="btn btn-ghost">重新整理名單</button>
      </div>
      <p class="text-sm text-slate-500 m-0">請用下方搜尋找人後勾選「收通知」。預設只顯示已勾選的人，不會一次列出全部綁定帳號。</p>
      <div class="flex flex-wrap items-center gap-2">
        <input type="search" id="line-search" placeholder="搜尋姓名／帳號／處別／LINE 名稱" class="flex-1 min-w-[14rem] max-w-md" autocomplete="off" />
        <button type="button" id="btn-line-search-clear" class="btn btn-ghost">清除搜尋</button>
      </div>
      <p id="line-msg" class="text-sm text-slate-500 min-h-[1.25rem]"></p>
      <div class="overflow-auto border border-slate-200 rounded-xl bg-white">
        <table>
          <thead>
            <tr>
              <th>工具箱帳號</th>
              <th>處別</th>
              <th>LINE 名稱</th>
              <th>綁定時間</th>
              <th>收財務回報通知</th>
            </tr>
          </thead>
          <tbody id="line-rows"></tbody>
        </table>
      </div>
    </div>

    <div class="card p-4 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <input type="search" id="search" placeholder="搜尋類型／姓名／處所／填表人／內容" class="max-w-md" autocomplete="off" />
        <button type="button" id="btn-refresh" class="btn btn-ghost">重新整理</button>
      </div>
      <p class="filter-label">狀態</p>
      <div class="status-filters" id="status-filters" role="tablist" aria-label="案件狀態篩選">
        <button type="button" data-fin-filter="all" class="is-on">全部</button>
        <button type="button" data-fin-filter="submitted">待處理</button>
        <button type="button" data-fin-filter="processing">處理中</button>
        <button type="button" data-fin-filter="closed">已結案</button>
        <button type="button" data-fin-filter="rejected">已退件</button>
        <button type="button" data-fin-filter="resubmitted">已補件</button>
      </div>
      <p class="filter-label">分類（與前台相同）</p>
      <div class="type-filters" id="type-filters" role="tablist" aria-label="案件類型分類">
        <button type="button" data-fin-type="all" class="is-on">全部分類</button>
        <button type="button" data-fin-type="pkg">社宅包租金流相關</button>
        <button type="button" data-fin-type="pay">社宅租金及款項處理</button>
        <button type="button" data-fin-type="collect">社宅催收管理相關問題</button>
        <button type="button" data-fin-type="cashflow">金流明細表調閱申請</button>
        <button type="button" data-fin-type="stop">止付通知</button>
        <button type="button" data-fin-type="gen">一般宅金流相關</button>
        <button type="button" data-fin-type="office">商辦部</button>
      </div>
      <p id="msg" class="text-sm text-slate-500 min-h-[1.25rem]"></p>
      <div class="overflow-auto border border-slate-200 rounded-xl bg-white">
        <table>
          <thead>
            <tr>
              <th>時間</th>
              <th>序號</th>
              <th>狀態</th>
              <th>類型</th>
              <th>填表人</th>
              <th>姓名／處所</th>
              <th>內容</th>
              <th>附件</th>
              <th>LINE／退件／刪除</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </section>

  <script>
    (function () {
      const SECRET_KEY = 'skyfun-fin-report-admin';
      let client = null;
      let secret = '';
      let allRows = [];
      let allLineItems = [];
      let statusFilter = 'all';
      let typeFilter = 'all';

      const TYPE_META = {
        pkg: {
          key: 'pkg',
          label: '社宅包租金流相關',
          match: ['社宅包租金流相關(進件、解約或資料異動)']
        },
        pay: {
          key: 'pay',
          label: '社宅租金及款項處理',
          match: ['社宅租金及款項處理']
        },
        collect: {
          key: 'collect',
          label: '社宅催收管理相關問題',
          match: ['社宅催收管理相關問題']
        },
        cashflow: {
          key: 'cashflow',
          label: '金流明細表調閱申請',
          match: ['金流明細表調閱申請', '補件與資料查詢']
        },
        stop: {
          key: 'stop',
          label: '止付通知',
          match: ['止付通知']
        },
        gen: {
          key: 'gen',
          label: '一般宅金流相關',
          match: ['一般宅金流相關(進件、解約)']
        },
        office: {
          key: 'office',
          label: '商辦部',
          match: ['商辦部']
        }
      };

      function typeKeyOf(issueType) {
        const t = String(issueType || '');
        for (const meta of Object.values(TYPE_META)) {
          if (meta.match.indexOf(t) >= 0) return meta.key;
        }
        return '';
      }

      function typeLabelOf(issueType) {
        const key = typeKeyOf(issueType);
        if (key && TYPE_META[key]) return TYPE_META[key].label;
        return String(issueType || '—');
      }

      function cfg() {
        const c = window.SKYFUN_SUPABASE || {};
        return { url: String(c.url || '').trim(), anonKey: String(c.anonKey || c.anon_key || '').trim() };
      }
      function sb() {
        if (client) return client;
        const { url, anonKey } = cfg();
        client = window.supabase.createClient(url, anonKey);
        return client;
      }
      async function rpc(name, args) {
        const { data, error } = await sb().rpc(name, args);
        if (error) throw new Error(error.message || 'Supabase 錯誤');
        return data;
      }
      function esc(s) {
        return String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
      }
      function fmt(iso) {
        if (!iso) return '—';
        try { return new Date(iso).toLocaleString('zh-TW', { hour12: false }); } catch { return iso; }
      }
      const PAYLOAD_LABELS = {
        address: '物件地址',
        landlord: '房東',
        tenant: '房客',
        note: '備註',
        rent: '租金',
        managementFee: '管理費',
        deposit: '押金金額',
        caseType: '案件類型',
        systemDataPendingFix: '系統資料待更正',
        pkgItem: '包租金流項目',
        baoLeaseStart: '包租開始日',
        baoLeaseEnd: '包租到期日',
        zhuanLeaseStart: '轉租開始日',
        zhuanLeaseEnd: '轉租到期日',
        leaseStart: '租期起',
        leaseEnd: '租期迄',
        leasePick: '公司案件參考',

        renewTopup: '是否補足押金',
        topupAmount: '補足金額',
        receivable: '應收款項',
        receivableOther: '應收其他說明',
        pkgDocs: '證明文件類型',
        rematchType: '換約類型',
        oldTenant: '原房客',

        hasRoommate: '有無同住',
        roommates: '同住人',
        roommate: '同住人',
        refundType: '退押類型',

        landlordReason: '房東異動原因',
        passbookWhy: '換存摺原因',
        tenantReason: '房客異動原因',
        tenantPassbookWhy: '房客換存摺原因',
        oldParty: '原對象',
        newParty: '新對象',
        changeNote: '異動說明',

        newBankCode: '新銀行代碼',
        newBranch: '新分行',
        newBranchCode: '新分行代碼',
        newAccount: '新帳號',
        passbookNote: '存摺備註',
        payItem: '租金款項項目',
        virtualAccount: '虛擬帳號',
        payerName: '匯款人',
        txDate: '交易日',
        wrongAccount: '錯誤帳號',
        correctAccount: '正確帳號',
        amount: '金額',
        reason: '原因',
        collectItem: '催收項目',
        adjustItem: '調整項目',
        feeChange: '費用異動',
        changedAmount: '異動金額',
        subChangeStart: '轉租異動起日',
        pkgChangeStart: '包租異動起日',
        abnormalNote: '異常說明',
        suppItem: '補件項目',
        originAddress: '原案地址',
        originSerial: '原案序號',
        missingItems: '退件原因',
        expectCancelDate: '預計解約日',
        cancelTogether: '包轉是否同解',
        originRejectReason: '原退件原因',

        stopPayStart: '止付起始日',

        genKind: '一般宅類型',
        feeLandlord: '房東費用',
        feeTenant: '房客費用',
        managePct: '管理費％',
        genCancelDate: '一般宅解約日',
        genSettle: '結清方式',
        venue: '館別',
        officeItem: '商辦項目',
        bizCase: '案件類型',
        contractType: '合約類型',
        contractSerial: '合約編號',
        bizAction: '商辦動作',
        bizIncome: '收入項目',
        bizRoomAction: '會議室動作',
        bizRefundAction: '退款動作',
        signedDone: '是否已簽約',
        clientInfo: '客戶資料',
        officeRoom: '辦公室／會議室',
        remitAmount: '匯款金額',
        remitTotal: '匯款總額',
        remitDeposit: '押金',
        remitRent: '租金',
        remitCopy: '影印費',
        meetDate: '會議室日期',
        meetSlot: '會議室時段',
        remitDate: '匯款日',
        remitTail: '尾款',
        bizCheckNote: '核對說明',
        contractStart: '合約起日',
        contractEnd: '合約迄日',
        contractPeriods: '期數',
        periodPrice: '每期金額',
        rentTotal: '租金總額',
        deposit: '押金金額',
        invoiceItem: '發票項目',
        invoiceType: '發票開立類型',
        invoiceClient: '發票客戶',
        invoiceBuyer: '買受人',
        invoiceTaxId: '統編',
        invoiceAmount: '發票金額',
        invoiceProduct: '品名',
        bizInvoiceNote: '發票備註',
        refundClient: '退款客戶',
        refundBank: '退款銀行',
        refundBranch: '退款分行',
        refundName: '退款戶名',
        refundAccount: '退款帳號',
        refundFee: '是否扣手續費',
        refundAmount: '退款金額',
        bizRefundNote: '退款備註'
      };
      const PAYLOAD_ORDER = [
        'address', 'landlord', 'tenant', 'rent', 'managementFee', 'deposit', 'caseType', 'systemDataPendingFix',
        'pkgItem', 'payItem', 'collectItem', 'suppItem', 'genItem',
        'officeItem', 'venue', 'depositType', 'pkgDocs', 'receivable', 'receivableOther',
        'baoLeaseStart', 'baoLeaseEnd', 'zhuanLeaseStart', 'zhuanLeaseEnd', 'leaseStart', 'leaseEnd',
        'leasePick', 'renewTopup', 'topupAmount', 'rematchType', 'oldTenant', 'newTenant', 'hasRoommate',
        'roommates', 'roommate', 'refundType', 'refundDate', 'refundMethod', 'refundSettle', 'refundGap',
        'refundSubleaseStart', 'hasGap', 'subleaseStart', 'changeTarget', 'landlordReason', 'tenantReason',
        'passbookWhy', 'tenantPassbookWhy', 'oldParty', 'newParty', 'changeNote',
        'oldAccountName', 'oldBank', 'oldBankCode', 'oldBranch', 'oldBranchCode', 'oldAccount',
        'newAccountName', 'newBank', 'newBankCode', 'newBranch', 'newBranchCode', 'newAccount', 'passbookNote',
        'virtualAccount', 'payerName', 'txDate', 'wrongAccount', 'correctAccount', 'amount', 'reason',
        'adjustItem', 'feeChange', 'changedAmount', 'subChangeStart', 'pkgChangeStart', 'abnormalNote',
        'originSerial', 'originAddress', 'originIssueType', 'originRejectReason', 'missingItems',
        'expectCancelDate', 'cancelTogether', 'stopPayStart',
        'genLeaseStart', 'genLeaseEnd', 'genKind', 'feeLandlord', 'feeTenant', 'managePct', 'genCancelDate', 'genSettle',
        'bizCase', 'contractType', 'contractSerial', 'bizAction', 'bizIncome', 'bizRoomAction', 'bizRefundAction',
        'signedDone', 'clientInfo', 'officeRoom', 'meetDate', 'meetSlot',
        'remitAmount', 'remitTotal', 'remitDeposit', 'remitRent', 'remitCopy', 'remitDate', 'remitTail', 'bizCheckNote',
        'contractStart', 'contractEnd', 'contractPeriods', 'periodPrice', 'rentTotal', 'deposit',
        'invoiceItem', 'invoiceType', 'invoiceClient', 'invoiceBuyer', 'invoiceTaxId', 'invoiceAmount', 'invoiceProduct', 'bizInvoiceNote',
        'refundClient', 'refundBank', 'refundBranch', 'refundName', 'refundAccount', 'refundFee', 'refundAmount', 'bizRefundNote',
        'note'
      ];
      function payloadEntries(p) {
        p = p || {};
        const seen = new Set();
        const hide = new Set(['companyCompare']);
        const out = [];
        function push(k) {
          if (hide.has(k) || seen.has(k) || !Object.prototype.hasOwnProperty.call(p, k)) return;
          seen.add(k);
          let v = p[k];
          if (v == null || v === '') return;
          if (typeof v === 'boolean') v = v ? '是' : '否';
          if (Array.isArray(v)) {
            if (!v.length) return;
            v = v.join('、');
          } else if (typeof v === 'object') {
            return;
          } else {
            v = String(v);
          }
          out.push({ key: k, label: PAYLOAD_LABELS[k] || k, value: v });
        }
        PAYLOAD_ORDER.forEach(push);
        Object.keys(p).forEach(push);
        return out;
      }
      function companyCompareHtml(cmp) {
        if (!cmp || typeof cmp !== 'object') return '';
        const fields = cmp.fields && typeof cmp.fields === 'object' ? cmp.fields : {};
        const keys = Object.keys(fields);
        if (!keys.length) return '';
        const meta = [
          cmp.comparedAt ? ('比對時間：' + fmt(cmp.comparedAt)) : '',
          cmp.comparedBy ? ('操作人：' + cmp.comparedBy) : '',
          cmp.systemDataPendingFix ? '標記：系統資料待更正' : ''
        ].filter(Boolean).join('｜');
        const rows = keys.map((key) => {
          const f = fields[key] || {};
          const flag = f.override ? '系統有誤' : (f.ok ? '相符' : '不符');
          return '<div class="body-row"><div class="body-k">' + esc(PAYLOAD_LABELS[key] || key) +
            '（' + esc(flag) + '）</div><div class="body-v">申請人：' + esc(f.user || '—') +
            '<br>公司系統：' + esc(f.companyDisplay || f.company || '（無資料）') +
            (f.override && f.overrideNote ? '<br>說明：' + esc(f.overrideNote) : '') +
            '</div></div>';
        }).join('');
        return '<div class="body-dl" style="margin-top:0.55rem;border-top:1px dashed #cbd5e1;padding-top:0.45rem">' +
          '<div class="body-row"><div class="body-k">公司系統比對</div><div class="body-v">' + esc(meta || '—') + '</div></div>' +
          rows + '</div>';
      }
      function payloadText(p) {
        const rows = payloadEntries(p);
        return rows.length ? rows.map((r) => r.label + '：' + r.value).join('\n') : '—';
      }
      function payloadHtml(p) {
        const rows = payloadEntries(p);
        const pending = !!(p && (p.systemDataPendingFix || (p.companyCompare && p.companyCompare.systemDataPendingFix)));
        const badge = pending
          ? '<div style="margin:0 0 0.4rem;display:inline-block;padding:0.1rem 0.45rem;border-radius:999px;background:#ffedd5;color:#9a3412;font-size:0.72rem;font-weight:800">系統資料待更正</div>'
          : '';
        if (!rows.length && !p?.companyCompare) return '<span class="body-empty">—</span>';
        return badge + '<div class="body-dl">' + rows.map((r) =>
          '<div class="body-row"><div class="body-k">' + esc(r.label) + '</div><div class="body-v">' + esc(r.value) + '</div></div>'
        ).join('') + '</div>' + companyCompareHtml(p && p.companyCompare);
      }
      function filesHtml(files) {
        const list = Array.isArray(files) ? files : [];
        if (!list.length) return '—';
        return '<div class="atts">' + list.map((f) =>
          '<a href="' + esc(f.url || '') + '" target="_blank" rel="noopener" download="' + esc(f.name || '附件') + '">' + esc(f.name || '下載') + '</a>'
        ).join('') + '</div>';
      }
      function statusLabel(st) {
        const s = String(st || 'submitted');
        if (s === 'rejected') return '<span class="st st-rejected">已退件</span>';
        if (s === 'resubmitted') return '<span class="st st-resubmitted">已補件</span>';
        if (s === 'processing') return '<span class="st st-processing">處理中</span>';
        if (s === 'closed') return '<span class="st st-closed">已結案</span>';
        return '<span class="st st-submitted">待處理</span>';
      }
      function filtered() {
        const q = document.getElementById('search').value.trim().toLowerCase();
        return allRows.filter((r) => {
          const st = String(r.status || 'submitted');
          if (statusFilter !== 'all' && st !== statusFilter) return false;
          if (typeFilter !== 'all' && typeKeyOf(r.issueType) !== typeFilter) return false;
          if (!q) return true;
          const blob = [
            r.id, r.status, r.rejectReason, r.issueType, typeLabelOf(r.issueType),
            r.userName, r.fullName, r.office, r.lineError, payloadText(r.payload)
          ].join(' ').toLowerCase();
          return blob.includes(q);
        });
      }
      function actionHtml(r) {
        const st = String(r.status || 'submitted');
        const line = (r.lineRecipients > 0)
          ? ('已推 ' + r.lineRecipients + ' 人')
          : (r.lineError ? esc(r.lineError) : '未推播');
        let html = '<div class="muted">' + line + '</div>';
        const delBtn = '<div class="act-row" style="margin-top:0.35rem"><button type="button" data-fin-delete="' + esc(r.id) + '">刪除案件</button></div>';
        if (st === 'rejected') {
          html += '<p class="reject-reason"><b>退件原因</b><br>' + esc(r.rejectReason || '—') + '</p>';
          html += delBtn;
          return html;
        }
        if (st === 'closed') {
          html += '<p class="muted" style="margin:0.25rem 0 0">結案時間：' + esc(fmt(r.handledAt)) + '</p>';
          html += delBtn;
          return html;
        }
        html += '<div class="act-box"><div class="act-row">';
        if (st === 'submitted' || st === 'resubmitted') {
          html += '<button type="button" data-fin-status="processing" data-fin-id="' + esc(r.id) + '">開始處理</button>';
        }
        if (st === 'submitted' || st === 'resubmitted' || st === 'processing') {
          html += '<button type="button" data-fin-status="closed" data-fin-id="' + esc(r.id) + '">結案</button>';
        }
        html += '<button type="button" data-fin-delete="' + esc(r.id) + '">刪除案件</button>';
        html += '</div>';
        if (st === 'resubmitted') {
          html += '<p class="reject-reason muted">原退件：' + esc(r.rejectReason || '—') + '</p>';
        }
        html +=
          '<div class="reject-box">' +
          '<textarea data-fin-reject-reason="' + esc(r.id) + '" placeholder="財務退件原因（必填）"></textarea>' +
          '<button type="button" data-fin-reject="' + esc(r.id) + '">退件</button>' +
          '</div></div>';
        return html;
      }
      function render() {
        const list = filtered();
        const statusCounts = { all: 0, submitted: 0, processing: 0, closed: 0, rejected: 0, resubmitted: 0 };
        const typeCounts = { all: 0, pkg: 0, pay: 0, collect: 0, cashflow: 0, stop: 0, gen: 0, office: 0 };
        allRows.forEach((r) => {
          const st = String(r.status || 'submitted');
          const tk = typeKeyOf(r.issueType);
          const inType = typeFilter === 'all' || tk === typeFilter;
          const inStatus = statusFilter === 'all' || st === statusFilter;
          if (inType) {
            statusCounts.all += 1;
            if (statusCounts[st] != null) statusCounts[st] += 1;
          }
          if (inStatus) {
            typeCounts.all += 1;
            if (tk && typeCounts[tk] != null) typeCounts[tk] += 1;
          }
        });
        document.querySelectorAll('#status-filters [data-fin-filter]').forEach((btn) => {
          const key = btn.getAttribute('data-fin-filter');
          const n = statusCounts[key] != null ? statusCounts[key] : 0;
          const label = ({
            all: '全部', submitted: '待處理', processing: '處理中',
            closed: '已結案', rejected: '已退件', resubmitted: '已補件'
          })[key] || key;
          btn.textContent = label + ' ' + n;
          btn.classList.toggle('is-on', statusFilter === key);
        });
        document.querySelectorAll('#type-filters [data-fin-type]').forEach((btn) => {
          const key = btn.getAttribute('data-fin-type');
          const n = typeCounts[key] != null ? typeCounts[key] : 0;
          const label = key === 'all' ? '全部分類' : ((TYPE_META[key] && TYPE_META[key].label) || key);
          btn.textContent = label + ' ' + n;
          btn.classList.toggle('is-on', typeFilter === key);
        });
        document.getElementById('msg').textContent = list.length ? '共 ' + list.length + ' 筆' : '沒有符合的回報';
        document.getElementById('rows').innerHTML = list.map((r) => {
          const st = String(r.status || 'submitted');
          return '<tr>' +
            '<td class="whitespace-nowrap">' + esc(fmt(r.createdAt)) + '</td>' +
            '<td class="whitespace-nowrap"><b>#' + esc(r.id) + '</b></td>' +
            '<td>' + statusLabel(st) + '</td>' +
            '<td class="type">' + esc(typeLabelOf(r.issueType)) +
              (String(r.issueType || '') !== typeLabelOf(r.issueType)
                ? '<div class="muted">' + esc(r.issueType) + '</div>'
                : '') +
            '</td>' +
            '<td>' + esc(r.userName || '—') + '</td>' +
            '<td>' + esc(r.fullName || '—') + '<div class="muted">' + esc(r.office || '') + '</div></td>' +
            '<td class="body">' + payloadHtml(r.payload) + '</td>' +
            '<td>' + filesHtml(r.files) + '</td>' +
            '<td>' + actionHtml(r) + '</td>' +
            '</tr>';
        }).join('');
      }
      async function load() {
        document.getElementById('msg').textContent = '載入中…';
        const data = await rpc('fin_report_admin_list', { p_secret: secret, p_limit: 300 });
        if (!data || data.ok === false) throw new Error((data && data.error) || '載入失敗');
        allRows = Array.isArray(data.rows) ? data.rows : [];
        render();
      }
      function lineQuery() {
        return (document.getElementById('line-search')?.value || '').trim().toLowerCase();
      }
      function filteredLineItems() {
        const q = lineQuery();
        if (!q) return allLineItems.filter((b) => b.notifyFinReport);
        return allLineItems.filter((b) => {
          const blob = [b.name, b.username, b.team, b.lineName].join(' ').toLowerCase();
          return blob.includes(q);
        });
      }
      function renderLine() {
        const msg = document.getElementById('line-msg');
        const rows = document.getElementById('line-rows');
        const q = lineQuery();
        const on = allLineItems.filter((b) => b.notifyFinReport).length;
        const list = filteredLineItems();
        if (!allLineItems.length) {
          msg.textContent = '還沒有人綁定 LINE';
          rows.innerHTML = '<tr><td colspan="5" class="muted">還沒有人綁定 LINE</td></tr>';
          return;
        }
        if (!q) {
          msg.textContent = '已綁定 ' + allLineItems.length + ' 人，目前 ' + on + ' 人會收到通知。請搜尋姓名／帳號後再勾選；下方僅顯示已勾選者。';
        } else {
          msg.textContent = '搜尋「' + q + '」找到 ' + list.length + ' 人（全部已綁定 ' + allLineItems.length + ' 人，已勾選收通知 ' + on + ' 人）';
        }
        if (!list.length) {
          rows.innerHTML = '<tr><td colspan="5" class="muted">' +
            (q ? '沒有符合的人，請換關鍵字' : '尚未勾選任何人。請在上方搜尋後勾選「收通知」。') +
            '</td></tr>';
          return;
        }
        rows.innerHTML = list.map((b) =>
          '<tr>' +
          '<td>' + esc(b.name || b.username || '—') + ' <span class="muted">' + esc(b.username || '') + '</span></td>' +
          '<td class="whitespace-nowrap">' + esc(b.team || '—') + '</td>' +
          '<td>' + esc(b.lineName || '—') + '</td>' +
          '<td class="whitespace-nowrap">' + esc(fmt(b.boundAt)) + '</td>' +
          '<td><label class="inline-flex items-center gap-2 cursor-pointer">' +
          '<input type="checkbox" data-fin-line-notify="' + esc(b.userId) + '"' + (b.notifyFinReport ? ' checked' : '') + ' class="w-4 h-4 accent-emerald-600"> 收通知</label></td>' +
          '</tr>'
        ).join('');
      }
      async function loadLine() {
        const msg = document.getElementById('line-msg');
        msg.textContent = '載入中…';
        try {
          const data = await rpc('fin_report_admin_line_list', { p_secret: secret });
          if (!data || data.ok === false) throw new Error((data && data.error) || '載入失敗');
          allLineItems = Array.isArray(data.items) ? data.items : [];
          renderLine();
        } catch (e) {
          msg.textContent = e.message || String(e);
        }
      }
      async function login() {
        const msg = document.getElementById('login-msg');
        msg.classList.add('hidden');
        secret = document.getElementById('admin-secret').value.trim();
        if (!secret) {
          msg.textContent = '請輸入總管密碼';
          msg.classList.remove('hidden');
          return;
        }
        try {
          await load();
          try { sessionStorage.setItem(SECRET_KEY, secret); } catch (_) {}
          document.getElementById('login-panel').classList.add('hidden');
          document.getElementById('main-panel').classList.remove('hidden');
          loadLine();
        } catch (e) {
          msg.textContent = e.message || String(e);
          msg.classList.remove('hidden');
        }
      }
      document.getElementById('btn-login').addEventListener('click', login);
      document.getElementById('admin-secret').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') login();
      });
      document.getElementById('btn-refresh').addEventListener('click', () => load().catch((e) => {
        document.getElementById('msg').textContent = e.message || String(e);
      }));
      document.getElementById('btn-line-refresh').addEventListener('click', loadLine);
      document.getElementById('line-search').addEventListener('input', renderLine);
      document.getElementById('btn-line-search-clear').addEventListener('click', () => {
        const el = document.getElementById('line-search');
        if (el) el.value = '';
        renderLine();
        el?.focus();
      });
      document.getElementById('line-rows').addEventListener('change', async (e) => {
        const box = e.target.closest('[data-fin-line-notify]');
        if (!box) return;
        const uid = box.getAttribute('data-fin-line-notify');
        const on = box.checked;
        box.disabled = true;
        try {
          const res = await rpc('fin_report_admin_set_line_notify', {
            p_secret: secret,
            p_user_id: uid,
            p_on: on
          });
          if (!res || res.ok === false) throw new Error((res && res.error) || '儲存失敗');
          const item = allLineItems.find((b) => String(b.userId) === String(uid));
          if (item) item.notifyFinReport = on;
          renderLine();
        } catch (err) {
          box.checked = !on;
          box.disabled = false;
          document.getElementById('line-msg').textContent = err.message || String(err);
        }
      });
      document.getElementById('search').addEventListener('input', render);
      document.getElementById('status-filters').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-fin-filter]');
        if (!btn) return;
        statusFilter = btn.getAttribute('data-fin-filter') || 'all';
        render();
      });
      document.getElementById('type-filters').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-fin-type]');
        if (!btn) return;
        typeFilter = btn.getAttribute('data-fin-type') || 'all';
        render();
      });
      document.getElementById('rows').addEventListener('click', async (e) => {
        const delBtn = e.target.closest('[data-fin-delete]');
        if (delBtn) {
          const id = delBtn.getAttribute('data-fin-delete');
          if (!confirm('確定刪除案件 #' + id + '？\n附件一併刪除，無法復原。')) return;
          delBtn.disabled = true;
          try {
            const res = await rpc('fin_report_admin_delete', {
              p_secret: secret,
              p_id: Number(id)
            });
            if (!res || res.ok === false) throw new Error((res && res.error) || '刪除失敗');
            const paths = Array.isArray(res.paths) ? res.paths.filter(Boolean) : [];
            if (paths.length) {
              try {
                const { error: rmErr } = await sb().storage.from('fin-report').remove(paths);
                if (rmErr) console.warn('fin-report storage remove', rmErr);
              } catch (rmEx) {
                console.warn('fin-report storage remove', rmEx);
              }
            }
            allRows = allRows.filter((r) => String(r.id) !== String(id));
            render();
            document.getElementById('msg').textContent = '已刪除案件 #' + id;
          } catch (err) {
            delBtn.disabled = false;
            document.getElementById('msg').textContent = err.message || String(err);
          }
          return;
        }
        const statusBtn = e.target.closest('[data-fin-status]');
        if (statusBtn) {
          const id = statusBtn.getAttribute('data-fin-id');
          const next = statusBtn.getAttribute('data-fin-status');
          statusBtn.disabled = true;
          try {
            const res = await rpc('fin_report_admin_set_status', {
              p_secret: secret,
              p_id: Number(id),
              p_status: next
            });
            if (!res || res.ok === false) throw new Error((res && res.error) || '更新狀態失敗');
            const idx = allRows.findIndex((r) => String(r.id) === String(id));
            if (idx >= 0 && res.row) allRows[idx] = res.row;
            else await load();
            render();
            document.getElementById('msg').textContent =
              (next === 'closed' ? '已結案 #' : '已改為處理中 #') + id;
          } catch (err) {
            statusBtn.disabled = false;
            document.getElementById('msg').textContent = err.message || String(err);
          }
          return;
        }
        const btn = e.target.closest('[data-fin-reject]');
        if (!btn) return;
        const id = btn.getAttribute('data-fin-reject');
        const ta = document.querySelector('[data-fin-reject-reason="' + id + '"]');
        const reason = (ta && ta.value || '').trim();
        if (!reason) {
          document.getElementById('msg').textContent = '請先填退件原因';
          ta?.focus();
          return;
        }
        btn.disabled = true;
        try {
          const res = await rpc('fin_report_admin_reject', {
            p_secret: secret,
            p_id: Number(id),
            p_reason: reason
          });
          if (!res || res.ok === false) throw new Error((res && res.error) || '退件失敗');
          const idx = allRows.findIndex((r) => String(r.id) === String(id));
          if (idx >= 0 && res.row) allRows[idx] = res.row;
          else await load();
          render();
          document.getElementById('msg').textContent = '已退件 #' + id;
        } catch (err) {
          btn.disabled = false;
          document.getElementById('msg').textContent = err.message || String(err);
        }
      });
      try {
        const saved = sessionStorage.getItem(SECRET_KEY) || '';
        if (saved) {
          document.getElementById('admin-secret').value = saved;
          login();
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
