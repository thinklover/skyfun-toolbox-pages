<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI婷婷對話紀錄 — 星鴻工具箱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <link rel="stylesheet" href="../css/admin-shell.css?v=20261013-1" />
  <style>
    .filters { display: flex; flex-wrap: wrap; gap: 0.55rem; align-items: end; }
    .filters .field { flex: 1 1 10rem; min-width: 0; }
    .filters label { display: block; font-size: 0.72rem; color: #64748b; margin-bottom: 0.25rem; font-weight: 700; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .chips button {
      border: 1px solid #cbd5e1; background: #fff; color: #475569; border-radius: 999px;
      padding: 0.3rem 0.75rem; font-size: 0.75rem; font-weight: 800; cursor: pointer;
    }
    .chips button.is-on { background: #6d28d9; border-color: #6d28d9; color: #fff; }
    .item {
      border: 1px solid #e2e8f0; border-radius: 0.85rem; padding: 0.85rem 0.95rem;
      background: #fff; margin-bottom: 0.65rem;
    }
    .item-top { display: flex; flex-wrap: wrap; gap: 0.35rem 0.65rem; align-items: center; margin-bottom: 0.45rem; }
    .item-who { font-weight: 900; color: #4c1d95; }
    .item-meta { font-size: 0.75rem; color: #64748b; font-weight: 700; }
    .badge { font-size: 0.68rem; font-weight: 800; padding: 0.12rem 0.45rem; border-radius: 999px; }
    .badge-pending { background: #fef3c7; color: #92400e; }
    .badge-answered { background: #dcfce7; color: #166534; }
    .badge-failed { background: #fee2e2; color: #b91c1c; }
    .badge-zone { background: #ede9fe; color: #6d28d9; }
    .q-box, .a-box {
      border-radius: 0.65rem; padding: 0.65rem 0.75rem; white-space: pre-wrap;
      font-size: 0.88rem; line-height: 1.55; color: #0f172a;
    }
    .q-box { background: #f5f3ff; border: 1px solid #ddd6fe; margin-bottom: 0.45rem; }
    .a-box { background: #f8fafc; border: 1px solid #e2e8f0; }
    .a-box.is-staff { background: #ecfdf5; border-color: #a7f3d0; }
    .lbl { font-size: 0.7rem; font-weight: 800; color: #64748b; margin-bottom: 0.25rem; }
    .badge-staff { background: #d1fae5; color: #047857; }
    .reply-box {
      margin-top: 0.65rem; padding-top: 0.65rem; border-top: 1px dashed #e2e8f0;
    }
    .reply-box textarea {
      width: 100%; min-height: 5.5rem; border: 1px solid #c4b5fd; border-radius: 0.65rem;
      padding: 0.55rem 0.7rem; font-size: 0.88rem; line-height: 1.5; resize: vertical;
    }
    .reply-actions { display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center; margin-top: 0.45rem; }
    .reply-hint { font-size: 0.72rem; color: #64748b; font-weight: 700; }
    .reply-msg { font-size: 0.78rem; font-weight: 700; min-height: 1.1rem; }
    .reply-msg.is-ok { color: #047857; }
    .reply-msg.is-err { color: #b91c1c; }
    .staff-banner {
      background: #f5f3ff; border: 1px solid #ddd6fe; border-radius: 0.75rem;
      padding: 0.55rem 0.75rem; font-size: 0.8rem; color: #5b21b6; font-weight: 700;
      margin-bottom: 0.75rem;
    }
    .staff-banner.is-off { background: #fff7ed; border-color: #fed7aa; color: #9a3412; }
    .empty { color: #64748b; font-size: 0.88rem; padding: 0.75rem 0; }
    .summary { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 0.75rem; }
    .summary .chip {
      background: #faf5ff; border: 1px solid #ddd6fe; border-radius: 0.65rem;
      padding: 0.4rem 0.65rem; font-size: 0.78rem; color: #5b21b6; font-weight: 700;
    }
    .summary .chip strong { margin-right: 0.2rem; }
    .kb-gate-modal {
      position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center;
      background: rgba(15, 23, 42, 0.45); padding: 1rem;
    }
    .kb-gate-modal.hidden { display: none; }
    .kb-gate-card {
      width: min(22rem, 100%); background: #fff; border: 1px solid #e2e8f0; border-radius: 1rem;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.18); padding: 1.1rem 1.15rem 1rem;
    }
    .kb-gate-card h2 { margin: 0 0 0.35rem; font-size: 1.05rem; font-weight: 900; color: #312e81; }
    .kb-gate-card p.hint { margin: 0 0 0.75rem; font-size: 0.78rem; color: #64748b; line-height: 1.5; }
    .kb-gate-actions { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.75rem; }
  </style>
</head>
<body class="p-4 md:p-6 max-w-[96rem] mx-auto space-y-4">
  <header>
    <div class="topbar">
      <h1>AI婷婷對話紀錄</h1>
      <a class="back" href="../index.html">← 回工具箱</a>
      <button type="button" id="btn-kb-admin" class="btn btn-ghost hidden">知識庫後台</button>
    </div>
    <p class="lead">查看大家問過 AI婷婷 的問題與回覆（後台密碼）</p>
  </header>

  <div id="kb-gate-modal" class="kb-gate-modal hidden" role="dialog" aria-modal="true" aria-labelledby="kb-gate-title">
    <div class="kb-gate-card">
      <h2 id="kb-gate-title">知識庫後台門禁</h2>
      <p class="hint">請輸入知識庫後台專用密碼（與對話紀錄後台密碼不同）</p>
      <label class="block text-sm text-slate-600 font-bold" for="kb-gate-password">密碼</label>
      <input type="password" id="kb-gate-password" class="w-full" autocomplete="off" maxlength="128" />
      <p id="kb-gate-msg" class="text-sm err hidden" style="margin-top:0.5rem"></p>
      <div class="kb-gate-actions">
        <button type="button" id="kb-gate-submit" class="btn btn-main">確認開啟</button>
        <button type="button" id="kb-gate-cancel" class="btn btn-ghost">取消</button>
      </div>
    </div>
  </div>

  <section class="card p-4 space-y-3 max-w-xl" id="login-panel">
    <label class="block text-sm text-slate-600 font-bold">後台密碼（Supabase admin_secret）</label>
    <div class="flex flex-wrap gap-2">
      <input type="password" id="admin-secret" placeholder="後台密碼" class="flex-1 min-w-[12rem]" autocomplete="current-password" />
      <button type="button" id="btn-login" class="btn btn-main">連線</button>
    </div>
    <p id="login-msg" class="text-sm err hidden"></p>
  </section>

  <section class="card p-4 space-y-3 hidden" id="main-panel">
    <div class="filters">
      <div class="field">
        <label for="search">搜尋姓名／問題／回覆</label>
        <input type="search" id="search" placeholder="例如：弱勢戶、黃怡婷" autocomplete="off" />
      </div>
      <div class="field" style="flex: 0 0 auto;">
        <label>狀態</label>
        <div class="chips" id="status-chips" role="tablist" aria-label="狀態篩選">
          <button type="button" data-st="" class="is-on">全部</button>
          <button type="button" data-st="answered">已回覆</button>
          <button type="button" data-st="pending">回覆中</button>
          <button type="button" data-st="failed">失敗</button>
        </div>
      </div>
      <div class="field" style="flex: 0 0 auto;">
        <label>來源</label>
        <div class="chips" id="zone-chips" role="tablist" aria-label="來源篩選">
          <button type="button" data-zone="" class="is-on">全部</button>
          <button type="button" data-zone="admin">行政專區</button>
          <button type="button" data-zone="supervisor">業務主管</button>
        </div>
      </div>
      <button type="button" id="btn-refresh" class="btn btn-ghost">重新整理</button>
    </div>
    <div id="staff-banner" class="staff-banner hidden"></div>
    <div class="summary" id="summary"></div>
    <p id="msg" class="text-sm text-slate-500 min-h-[1.25rem]"></p>
    <div id="list"></div>
  </section>

  <script>
    (function () {
      const SECRET_KEY = 'skyfun-ai-tingting-admin';
      const STAFF_REPLY_NAMES = ['黃怡婷', '簡為倢', '邱奕棋'];
      const AUTH_STORAGE_KEY = 'skyfun-toolbox-auth-supabase-v1';
      let client = null;
      let secret = '';
      let rows = [];
      let statusFilter = '';
      let zoneFilter = '';

      function cfg() {
        const c = window.SKYFUN_SUPABASE || {};
        return { url: String(c.url || '').trim(), anonKey: String(c.anonKey || c.anon_key || '').trim() };
      }
      function sb() {
        if (client) return client;
        const { url, anonKey } = cfg();
        client = window.supabase.createClient(url, anonKey);
        return client;
      }
      async function rpc(name, args) {
        const { data, error } = await sb().rpc(name, args);
        if (error) throw new Error(error.message || 'Supabase 錯誤');
        return data;
      }
      function esc(s) {
        return String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
      }
      function fmt(iso) {
        if (!iso) return '—';
        try {
          return new Date(iso).toLocaleString('zh-TW', { hour12: false, timeZone: 'Asia/Taipei' });
        } catch {
          return String(iso);
        }
      }
      function toolboxSession() {
        try {
          return JSON.parse(localStorage.getItem(AUTH_STORAGE_KEY) || 'null');
        } catch {
          return null;
        }
      }
      function toolboxName() {
        const s = toolboxSession();
        return String(s?.user?.name || s?.supabaseUser?.name || '').trim();
      }
      function toolboxToken() {
        const s = toolboxSession();
        return String(s?.supabaseToken || s?.token || '').trim();
      }
      function canStaffReply() {
        return STAFF_REPLY_NAMES.includes(toolboxName());
      }
      function statusBadge(st) {
        if (st === 'answered') return '<span class="badge badge-answered">已回覆</span>';
        if (st === 'failed') return '<span class="badge badge-failed">失敗</span>';
        return '<span class="badge badge-pending">回覆中</span>';
      }
      function zoneLabel(z) {
        return z === 'supervisor' ? '業務主管' : '行政專區';
      }
      function setMsg(t, isErr) {
        const el = document.getElementById('msg');
        el.textContent = t || '';
        el.classList.toggle('err', !!isErr);
      }
      function renderStaffBanner() {
        const el = document.getElementById('staff-banner');
        if (!el) return;
        const name = toolboxName();
        const token = toolboxToken();
        el.classList.remove('hidden', 'is-off');
        if (canStaffReply() && token) {
          el.textContent = '目前以「' + name + '」登入：可直接人工回覆，送出後會 LINE 通知填寫人。';
          return;
        }
        el.classList.add('is-off');
        if (!token || !name) {
          el.textContent = '人工回覆需先在同瀏覽器登入工具箱（黃怡婷／簡為倢／邱奕棋）。';
        } else {
          el.textContent = '目前登入為「' + name + '」，僅黃怡婷／簡為倢／邱奕棋可人工回覆。';
        }
      }
      function renderSummary() {
        const total = rows.length;
        const answered = rows.filter((r) => r.status === 'answered').length;
        const pending = rows.filter((r) => r.status === 'pending').length;
        const failed = rows.filter((r) => r.status === 'failed').length;
        document.getElementById('summary').innerHTML =
          '<span class="chip"><strong>' + total + '</strong>筆</span>' +
          '<span class="chip"><strong>' + answered + '</strong>已回覆</span>' +
          '<span class="chip"><strong>' + pending + '</strong>回覆中</span>' +
          '<span class="chip"><strong>' + failed + '</strong>失敗</span>';
      }
      function replyFormHtml(r) {
        if (!canStaffReply() || !toolboxToken()) return '';
        const staff = String(r.staffRepliedBy || '').trim();
        return '<div class="reply-box">' +
          '<div class="lbl">人工回覆' + (staff ? '（將覆蓋並再通知）' : '（送出後 LINE 通知填寫人）') + '</div>' +
          '<textarea data-reply-input="' + esc(r.id) + '" placeholder="輸入要回覆給 ' + esc(r.userName || '填寫人') + ' 的內容" maxlength="4000"></textarea>' +
          '<div class="reply-actions">' +
            '<button type="button" class="btn btn-main" data-reply-send="' + esc(r.id) + '">送出回覆並 LINE 通知</button>' +
            '<span class="reply-hint">限黃怡婷／簡為倢／邱奕棋</span>' +
          '</div>' +
          '<p class="reply-msg" data-reply-msg="' + esc(r.id) + '"></p>' +
        '</div>';
      }
      function renderList() {
        const q = String(document.getElementById('search').value || '').trim().toLowerCase();
        const filtered = rows.filter((r) => {
          if (statusFilter && r.status !== statusFilter) return false;
          if (zoneFilter && r.zone !== zoneFilter) return false;
          if (!q) return true;
          const blob = [r.userName, r.question, r.answer, r.zone, r.status, r.staffRepliedBy].join(' ').toLowerCase();
          return blob.indexOf(q) >= 0;
        });
        const box = document.getElementById('list');
        if (!filtered.length) {
          box.innerHTML = '<p class="empty">目前沒有符合條件的對話。</p>';
          return;
        }
        box.innerHTML = filtered.map((r) => {
          const staff = String(r.staffRepliedBy || '').trim();
          const answerLabel = staff ? ('人工回覆（' + staff + '）') : 'AI婷婷回覆';
          return '<article class="item" data-id="' + esc(r.id) + '">' +
            '<div class="item-top">' +
              '<span class="item-who">' + esc(r.userName || '（未填姓名）') + '</span>' +
              statusBadge(r.status) +
              (staff ? '<span class="badge badge-staff">人工 · ' + esc(staff) + '</span>' : '') +
              '<span class="badge badge-zone">' + esc(zoneLabel(r.zone)) + '</span>' +
              '<span class="item-meta">' + esc(fmt(r.createdAt)) + '</span>' +
              (r.answeredAt ? '<span class="item-meta">回覆 ' + esc(fmt(r.answeredAt)) + '</span>' : '') +
            '</div>' +
            '<div class="lbl">問題</div><div class="q-box">' + esc(r.question) + '</div>' +
            '<div class="lbl">' + esc(answerLabel) + '</div><div class="a-box' + (staff ? ' is-staff' : '') + '">' +
              esc(r.answer || (r.status === 'pending' ? '（回覆中）' : r.status === 'failed' ? '（失敗）' : '（無內容）')) +
            '</div>' +
            replyFormHtml(r) +
          '</article>';
        }).join('');
      }
      async function sendStaffReply(id) {
        const ta = document.querySelector('[data-reply-input="' + id + '"]');
        const msgEl = document.querySelector('[data-reply-msg="' + id + '"]');
        const btn = document.querySelector('[data-reply-send="' + id + '"]');
        const answer = String(ta?.value || '').trim();
        const token = toolboxToken();
        if (msgEl) {
          msgEl.classList.remove('is-ok', 'is-err');
          msgEl.textContent = '';
        }
        if (!token) {
          if (msgEl) {
            msgEl.textContent = '請先回工具箱登入';
            msgEl.classList.add('is-err');
          }
          return;
        }
        if (!answer) {
          if (msgEl) {
            msgEl.textContent = '請輸入回覆內容';
            msgEl.classList.add('is-err');
          }
          return;
        }
        if (btn) btn.disabled = true;
        try {
          const data = await rpc('ai_tingting_staff_reply', {
            p_token: token,
            p_question_id: id,
            p_answer: answer
          });
          if (!data?.ok) throw new Error(data?.error || '回覆失敗');
          const line = data.line || {};
          const recipients = Number(line.recipients || 0);
          const lineOk = recipients > 0;
          const note = lineOk
            ? '已回覆，並已 LINE 通知填寫人'
            : ('已回覆，但 LINE 未送出' + (line.error ? '：' + line.error : ''));
          if (msgEl) {
            msgEl.textContent = note;
            msgEl.classList.add(lineOk ? 'is-ok' : 'is-err');
          }
          setMsg(note, !lineOk);
          await load();
        } catch (e) {
          if (msgEl) {
            msgEl.textContent = e.message || '回覆失敗';
            msgEl.classList.add('is-err');
          }
          setMsg(e.message || '回覆失敗', true);
        } finally {
          if (btn) btn.disabled = false;
        }
      }
      async function load() {
        setMsg('載入中…');
        try {
          const data = await rpc('ai_tingting_admin_list', {
            p_secret: secret,
            p_limit: 300,
            p_q: null,
            p_status: null,
            p_zone: null
          });
          if (!data?.ok) throw new Error(data?.error || '載入失敗');
          rows = Array.isArray(data.rows) ? data.rows : [];
          renderStaffBanner();
          renderSummary();
          renderList();
          setMsg('共 ' + rows.length + ' 筆');
        } catch (e) {
          rows = [];
          renderStaffBanner();
          renderSummary();
          renderList();
          setMsg(e.message || '載入失敗', true);
        }
      }
      function showMain() {
        document.getElementById('login-panel').classList.add('hidden');
        document.getElementById('main-panel').classList.remove('hidden');
        renderStaffBanner();
      }
      document.getElementById('btn-login').addEventListener('click', async () => {
        const input = document.getElementById('admin-secret');
        const msg = document.getElementById('login-msg');
        secret = String(input.value || '').trim();
        msg.classList.add('hidden');
        if (!secret) {
          msg.textContent = '請輸入後台密碼';
          msg.classList.remove('hidden');
          return;
        }
        try {
          const data = await rpc('ai_tingting_admin_list', {
            p_secret: secret,
            p_limit: 1,
            p_q: null,
            p_status: null,
            p_zone: null
          });
          if (!data?.ok) throw new Error(data?.error || '密碼錯誤');
          try { sessionStorage.setItem(SECRET_KEY, secret); } catch (_) {}
          showMain();
          await load();
        } catch (e) {
          msg.textContent = e.message || '連線失敗';
          msg.classList.remove('hidden');
        }
      });
      document.getElementById('btn-refresh').addEventListener('click', () => { void load(); });
      document.getElementById('search').addEventListener('input', () => renderList());
      document.getElementById('list').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-reply-send]');
        if (!btn) return;
        const id = btn.getAttribute('data-reply-send') || '';
        if (id) void sendStaffReply(id);
      });
      document.getElementById('status-chips').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-st]');
        if (!btn) return;
        statusFilter = btn.getAttribute('data-st') || '';
        document.querySelectorAll('#status-chips [data-st]').forEach((b) => {
          b.classList.toggle('is-on', b === btn);
        });
        renderList();
      });
      document.getElementById('zone-chips').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-zone]');
        if (!btn) return;
        zoneFilter = btn.getAttribute('data-zone') || '';
        document.querySelectorAll('#zone-chips [data-zone]').forEach((b) => {
          b.classList.toggle('is-on', b === btn);
        });
        renderList();
      });
      try {
        const saved = sessionStorage.getItem(SECRET_KEY) || '';
        if (saved) {
          secret = saved;
          document.getElementById('admin-secret').value = saved;
          showMain();
          void load();
        }
      } catch (_) {}

      /* —— 知識庫後台門禁（獨立於對話紀錄後台密碼） —— */
      const KB_ALLOWED_NAMES = STAFF_REPLY_NAMES;
      const KB_ADMIN_URL = 'https://tingting-admin.dahwork123.workers.dev';
      const KB_GATE_API = 'https://skyfun-tingting-kb-gate.dahwork123.workers.dev/api/tingting-kb-gate';
      const KB_GATE_OK_KEY = 'skyfun-tingting-kb-gate-ok';
      const KB_GATE_LOCK_KEY = 'skyfun-tingting-kb-gate-lock';
      const KB_MAX_FAILS = 5;
      const KB_LOCK_MS = 10 * 60 * 1000;

      function kbAllowed() {
        return KB_ALLOWED_NAMES.includes(toolboxName());
      }
      function kbGatePassed() {
        try {
          return sessionStorage.getItem(KB_GATE_OK_KEY) === '1';
        } catch {
          return false;
        }
      }
      function setKbGatePassed() {
        try { sessionStorage.setItem(KB_GATE_OK_KEY, '1'); } catch (_) {}
      }
      function readKbLock() {
        try {
          const raw = sessionStorage.getItem(KB_GATE_LOCK_KEY);
          if (!raw) return { fails: 0, until: 0 };
          const o = JSON.parse(raw);
          const until = Number(o?.until || 0);
          const fails = Number(o?.fails || 0);
          if (until && Date.now() >= until) {
            sessionStorage.removeItem(KB_GATE_LOCK_KEY);
            return { fails: 0, until: 0 };
          }
          return { fails, until };
        } catch {
          return { fails: 0, until: 0 };
        }
      }
      function writeKbLock(fails, until) {
        try {
          sessionStorage.setItem(KB_GATE_LOCK_KEY, JSON.stringify({ fails, until }));
        } catch (_) {}
      }
      function openKbAdmin() {
        window.open(KB_ADMIN_URL, '_blank', 'noopener,noreferrer');
      }
      function showKbModal(show) {
        const modal = document.getElementById('kb-gate-modal');
        const msg = document.getElementById('kb-gate-msg');
        const input = document.getElementById('kb-gate-password');
        if (!modal) return;
        modal.classList.toggle('hidden', !show);
        if (show) {
          msg.classList.add('hidden');
          msg.textContent = '';
          input.value = '';
          setTimeout(() => input.focus(), 30);
        }
      }
      function setKbMsg(text) {
        const msg = document.getElementById('kb-gate-msg');
        if (!text) {
          msg.classList.add('hidden');
          msg.textContent = '';
          return;
        }
        msg.textContent = text;
        msg.classList.remove('hidden');
      }
      async function submitKbGate() {
        const lock = readKbLock();
        if (lock.until && Date.now() < lock.until) {
          const mins = Math.max(1, Math.ceil((lock.until - Date.now()) / 60000));
          setKbMsg('嘗試次數過多，請 ' + mins + ' 分鐘後再試');
          return;
        }
        const password = String(document.getElementById('kb-gate-password').value || '');
        if (!password) {
          setKbMsg('請輸入密碼');
          return;
        }
        const token = toolboxToken();
        if (!token) {
          setKbMsg('請先回工具箱登入');
          return;
        }
        const btn = document.getElementById('kb-gate-submit');
        btn.disabled = true;
        setKbMsg('');
        try {
          const res = await fetch(KB_GATE_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Skyfun-Session': token },
            body: JSON.stringify({ token, password })
          });
          let data = null;
          try { data = await res.json(); } catch (_) { data = null; }
          if (res.status === 403) {
            setKbMsg('沒有權限');
            return;
          }
          if (res.status === 429 || data?.lockedUntil) {
            const until = Number(data?.lockedUntil || Date.now() + KB_LOCK_MS);
            writeKbLock(KB_MAX_FAILS, until);
            setKbMsg(data?.error || '密碼錯誤');
            return;
          }
          if (!res.ok || !data?.ok) {
            const fails = (readKbLock().fails || 0) + 1;
            if (fails >= KB_MAX_FAILS) {
              writeKbLock(fails, Date.now() + KB_LOCK_MS);
            } else {
              writeKbLock(fails, 0);
            }
            setKbMsg(data?.error || '密碼錯誤');
            return;
          }
          writeKbLock(0, 0);
          setKbGatePassed();
          showKbModal(false);
          openKbAdmin();
        } catch (e) {
          setKbMsg(e.message || '連線失敗');
        } finally {
          btn.disabled = false;
        }
      }
      function initKbGateButton() {
        const btn = document.getElementById('btn-kb-admin');
        if (!btn || !kbAllowed()) return;
        btn.classList.remove('hidden');
        btn.addEventListener('click', () => {
          if (kbGatePassed()) {
            openKbAdmin();
            return;
          }
          showKbModal(true);
        });
        document.getElementById('kb-gate-cancel').addEventListener('click', () => showKbModal(false));
        document.getElementById('kb-gate-submit').addEventListener('click', () => { void submitKbGate(); });
        document.getElementById('kb-gate-password').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            void submitKbGate();
          }
        });
        document.getElementById('kb-gate-modal').addEventListener('click', (e) => {
          if (e.target === e.currentTarget) showKbModal(false);
        });
      }
      initKbGateButton();
    })();
  </script>
</body>
</html>
