<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>帳號核准 — 星鴻工具箱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/skyfun-departments.js"></script>
  <link rel="stylesheet" href="../css/admin-shell.css?v=20261013-1" />
  <style>
    input:not([type="checkbox"]):not([type="radio"]), select { width: 100%; }
    table { font-size: 0.875rem; }
    th, td { padding: 0.65rem 0.5rem; vertical-align: top; }
    .badge-pending { background: #fef3c7; color: #92400e; font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 0.35rem; font-weight: 800; }
    .badge-on { background: #d1fae5; color: #065f46; font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 0.35rem; font-weight: 800; }
    .badge-off { background: #ffe4e6; color: #be123c; font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 0.35rem; font-weight: 800; }
    .badge-rejected { background: #fee2e2; color: #b91c1c; font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 0.35rem; font-weight: 800; }
    .badge-missing { background: #fef3c7; color: #92400e; font-size: 0.68rem; padding: 0.12rem 0.4rem; border-radius: 0.35rem; margin-left: 0.25rem; font-weight: 800; }
    .act-btn { border: 0; border-radius: 0.45rem; padding: 0.25rem 0.55rem; font-size: 0.75rem; font-weight: 800; cursor: pointer; margin-right: 0.25rem; margin-top: 0.25rem; }
    .act-ok { background: #15803d; color: #fff; }
    .act-warn { background: #b45309; color: #fff; }
    .act-danger { background: #b91c1c; color: #fff; }
    .act-save { background: #4f46e5; color: #fff; }
    .badge-double { background: #fef3c7; color: #b45309; border: 1px solid #fbbf24; font-size: 0.68rem; padding: 0.12rem 0.4rem; border-radius: 0.35rem; margin-left: 0.25rem; font-weight: 800; }
    .qa-double-toggle { display: flex; align-items: center; gap: 0.35rem; font-size: 0.75rem; color: #334155; margin-top: 0.35rem; white-space: nowrap; }
    .qa-double-toggle input { width: auto; }
    .team-cell { min-width: 11rem; }
    .team-cell select { font-size: 0.75rem; padding: 0.35rem 0.45rem; margin-bottom: 0.25rem; }
    .row-missing td { background: #fffbeb; }
    .team-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.6rem, 1fr)); gap: 0.3rem; }
    .team-stat {
      border: 1px solid #e2e8f0; border-radius: 0.45rem; padding: 0.28rem 0.25rem;
      background: #f8fafc; text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s;
      font: inherit; color: inherit; width: 100%;
    }
    .team-stat:hover:not(.is-zero) { border-color: #a5b4fc; }
    .team-stat-name { font-size: 0.58rem; color: #64748b; line-height: 1.15; word-break: break-all; }
    .team-stat-num { font-size: 0.88rem; font-weight: 800; color: #1e1b4b; margin-top: 0.08rem; line-height: 1.1; }
    .team-stat.is-zero { cursor: default; opacity: 0.55; }
    .team-stat.is-zero .team-stat-num { color: #94a3b8; font-weight: 600; }
    .team-stat.is-hot { border-color: #fbbf24; background: #fffbeb; }
    .team-stat.is-hot .team-stat-num { color: #b45309; }
    .team-stat.is-missing { border-color: #f87171; background: #fef2f2; }
    .team-stat.is-active { border-color: #4f46e5; background: #eef2ff; box-shadow: 0 0 0 1px #c7d2fe; }
    .team-stat.is-active .team-stat-num { color: #4338ca; }
    .team-detail { border: 1px solid #e2e8f0; border-radius: 0.65rem; background: #f8fafc; padding: 0.55rem 0.65rem; }
    .team-detail-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.35rem; margin-bottom: 0.45rem; }
    .team-detail-title { font-size: 0.78rem; font-weight: 800; color: #3730a3; }
    .team-detail-clear { border: 0; background: transparent; color: #64748b; font-size: 0.72rem; cursor: pointer; text-decoration: underline; }
    .team-detail-list { display: flex; flex-wrap: wrap; gap: 0.35rem; max-height: 8.5rem; overflow-y: auto; }
    .team-detail-item {
      font-size: 0.72rem; border: 1px solid #e2e8f0; border-radius: 0.45rem; padding: 0.28rem 0.45rem;
      background: #fff; color: #334155; white-space: nowrap;
    }
    .team-detail-item .name { font-weight: 800; color: #0f172a; }
    .team-detail-item .user { color: #64748b; margin-left: 0.25rem; }
    .team-detail-item .st { margin-left: 0.35rem; }
    .row-team-highlight td { background: #eef2ff; }
  </style>
</head>
<body class="p-4 md:p-6 max-w-[96rem] mx-auto space-y-4">
  <header>
    <div class="topbar">
      <h1>帳號核准後台</h1>
      <a class="back" href="../index.html">← 回工具箱</a>
    </div>
    <p class="lead">可補填舊帳號處別 · 與 Render 完整版共用 Supabase 帳號</p>
  </header>

  <section class="card p-4 space-y-3 max-w-xl" id="login-panel">
    <label class="block text-sm text-slate-600 font-bold">後台密碼（Supabase admin_secret）</label>
    <div class="flex flex-wrap gap-2">
      <input type="password" id="admin-secret" placeholder="後台密碼" class="flex-1 min-w-[12rem]" />
      <button type="button" id="btn-login" class="btn btn-main">連線</button>
    </div>
    <p id="login-msg" class="text-sm err hidden"></p>
  </section>

  <section class="card p-4 hidden space-y-3" id="main-panel">
    <div id="team-stats-panel" class="space-y-2 pb-1 border-b border-slate-700">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h2 class="section-h">各處申請帳號總數</h2>
        <p class="text-xs text-slate-500" id="team-stats-total">—</p>
      </div>
      <div class="team-stats" id="team-stats-grid"></div>
      <div class="team-detail hidden" id="team-detail-panel">
        <div class="team-detail-head">
          <p class="team-detail-title" id="team-detail-title">—</p>
          <button type="button" class="team-detail-clear" id="team-detail-clear">清除篩選</button>
        </div>
        <div class="team-detail-list" id="team-detail-list"></div>
      </div>
    </div>
    <div class="flex flex-wrap items-end gap-3">
      <div class="min-w-[10rem]">
        <label class="block text-xs text-slate-400 mb-1">篩選狀態</label>
        <select id="filter">
          <option value="pending">待核准</option>
          <option value="">全部</option>
          <option value="active">已核准</option>
          <option value="rejected">已拒絕</option>
          <option value="disabled">已停用</option>
        </select>
      </div>
      <div class="flex-1 min-w-[14rem] max-w-md">
        <label class="block text-xs text-slate-400 mb-1" for="search">搜尋帳號</label>
        <input type="search" id="search" placeholder="帳號／姓名／處別" autocomplete="off" />
      </div>
      <label class="flex items-center gap-2 text-sm text-slate-300 pb-2">
        <input type="checkbox" id="filter-missing-team" class="w-auto" />
        只顯示缺處別
      </label>
      <button type="button" id="btn-refresh" class="btn btn-ghost">重新整理</button>
      <p class="text-sm text-slate-400" id="count">—</p>
    </div>
    <p id="msg" class="text-sm text-slate-400"></p>
    <div class="overflow-x-auto">
      <table>
        <thead>
          <tr><th>帳號</th><th>顯示名稱</th><th>處別</th><th>QA 雙倍</th><th>QA 優質</th><th>狀態</th><th>註冊時間</th><th>操作</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <script>
    (function () {
      const SECRET_KEY = 'skyfun-pages-admin-secret';
      let client = null;
      let secret = '';
      let allUsers = [];
      let statsUsers = [];
      let selectedTeamFilter = null;

      function cfg() {
        const c = window.SKYFUN_SUPABASE || {};
        return { url: String(c.url || '').trim(), anonKey: String(c.anonKey || '').trim() };
      }

      function sb() {
        if (client) return client;
        const { url, anonKey } = cfg();
        client = window.supabase.createClient(url, anonKey);
        return client;
      }

      async function rpc(name, args) {
        const { data, error } = await sb().rpc(name, args);
        if (error) throw new Error(error.message || 'Supabase 錯誤');
        return data;
      }

      function esc(s) {
        return String(s || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function badge(status) {
        const map = {
          pending: ['badge-pending', '待核准'],
          active: ['badge-on', '已核准'],
          disabled: ['badge-off', '已停用'],
          rejected: ['badge-rejected', '已拒絕']
        };
        const [cls, label] = map[status] || ['badge-off', status];
        return `<span class="${cls}">${label}</span>`;
      }

      function fmt(iso) {
        if (!iso) return '—';
        try { return new Date(iso).toLocaleString('zh-TW'); } catch { return iso; }
      }

      function teamSelectHtml(userId, current) {
        const html = typeof window.buildSkyfunDepartmentSelectHtml === 'function'
          ? window.buildSkyfunDepartmentSelectHtml(current)
          : '<option value="">請選擇處別</option>';
        return `<select data-team-for="${esc(userId)}">${html}</select>`;
      }

      function knownDepartments() {
        if (Array.isArray(window.SKYFUN_DEPARTMENTS) && window.SKYFUN_DEPARTMENTS.length) {
          return window.SKYFUN_DEPARTMENTS.slice();
        }
        return ['北一處', '北二處', '北三處', '基一處', '桃一處', '竹一處', '宜一處', '中一處', '中二處', '中三處', '中四處', '中五處', '中六處', '彰一處', '嘉一處', '南一處', '南二處', '高一處', '高二處', '行政管理部', '總經理室', '租賃管理部', '電銷部', '客服部', '客滿部', '財務部'];
      }

      function userTeamKey(u) {
        return String(u.team || '').trim() || '（未填處別）';
      }

      function usersForTeam(teamKey) {
        return statsUsers.filter((u) => userTeamKey(u) === teamKey);
      }

      function renderTeamDetail(teamKey) {
        const panel = document.getElementById('team-detail-panel');
        const titleEl = document.getElementById('team-detail-title');
        const listEl = document.getElementById('team-detail-list');
        if (!panel || !titleEl || !listEl) return;
        if (!teamKey) {
          panel.classList.add('hidden');
          listEl.innerHTML = '';
          return;
        }
        const users = usersForTeam(teamKey).slice().sort((a, b) => {
          const ta = a.createdAt ? new Date(a.createdAt).getTime() : 0;
          const tb = b.createdAt ? new Date(b.createdAt).getTime() : 0;
          return tb - ta;
        });
        panel.classList.remove('hidden');
        titleEl.textContent = teamKey + ' · 共 ' + users.length + ' 人申請';
        if (!users.length) {
          listEl.innerHTML = '<span class="text-xs text-slate-500">尚無申請紀錄</span>';
          return;
        }
        listEl.innerHTML = users.map((u) => {
          const name = esc(u.name) || '—';
          const username = esc(u.username) || '—';
          return '<div class="team-detail-item"><span class="name">' + name + '</span><span class="user">' + username + '</span><span class="st">' + badge(u.status) + '</span></div>';
        }).join('');
      }

      function setTeamFilter(teamKey) {
        if (teamKey && !usersForTeam(teamKey).length) return;
        selectedTeamFilter = selectedTeamFilter === teamKey ? null : teamKey;
        renderTeamStats(statsUsers);
        renderTeamDetail(selectedTeamFilter);
        renderRows(allUsers);
        if (selectedTeamFilter) {
          document.getElementById('msg').textContent = '已篩選：' + selectedTeamFilter;
        }
      }

      function clearTeamFilter() {
        selectedTeamFilter = null;
        renderTeamStats(statsUsers);
        renderTeamDetail(null);
        renderRows(allUsers);
        document.getElementById('msg').textContent = '';
      }

      function renderTeamStats(allUsersForStats) {
        const grid = document.getElementById('team-stats-grid');
        const totalEl = document.getElementById('team-stats-total');
        if (!grid || !totalEl) return;
        const counts = {};
        const pendingCounts = {};
        (allUsersForStats || []).forEach((u) => {
          const t = userTeamKey(u);
          counts[t] = (counts[t] || 0) + 1;
          if (u.status === 'pending') pendingCounts[t] = (pendingCounts[t] || 0) + 1;
        });
        const rows = [];
        knownDepartments().forEach((name) => {
          rows.push({
            name,
            count: counts[name] || 0,
            pending: pendingCounts[name] || 0,
            kind: 'dept'
          });
          delete counts[name];
          delete pendingCounts[name];
        });
        Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b, 'zh-Hant')).forEach((name) => {
          rows.push({
            name,
            count: counts[name],
            pending: pendingCounts[name] || 0,
            kind: name === '（未填處別）' ? 'missing' : 'other'
          });
        });
        const total = (allUsersForStats || []).length;
        const pendingTotal = (allUsersForStats || []).filter((u) => u.status === 'pending').length;
        totalEl.textContent = '合計 ' + total + ' 個帳號' + (pendingTotal ? '（待核准 ' + pendingTotal + ' 個）' : '');
        grid.innerHTML = rows.map((row) => {
          const cls = [
            'team-stat',
            row.count === 0 ? 'is-zero' : '',
            row.count > 0 && row.kind === 'dept' ? 'is-hot' : '',
            row.kind === 'missing' && row.count > 0 ? 'is-missing' : '',
            row.kind === 'other' && row.count > 0 ? 'is-hot' : '',
            selectedTeamFilter === row.name ? 'is-active' : ''
          ].filter(Boolean).join(' ');
          const title = row.pending > 0 ? '點擊查看 · 待核准 ' + row.pending : '點擊查看申請名單';
          return '<button type="button" class="' + cls + '" data-team="' + esc(row.name) + '" title="' + title + '" ' + (row.count === 0 ? 'disabled' : '') + '><div class="team-stat-name">' + esc(row.name) + '</div><div class="team-stat-num">' + row.count + '</div></button>';
        }).join('');
      }

      function renderRows(users) {
        const missingOnly = document.getElementById('filter-missing-team').checked;
        let list = missingOnly
          ? users.filter((u) => !String(u.team || '').trim())
          : users.slice();
        if (selectedTeamFilter) {
          list = list.filter((u) => userTeamKey(u) === selectedTeamFilter);
        }
        const q = document.getElementById('search').value.trim().toLowerCase();
        if (q) {
          list = list.filter((u) => [u.username, u.name, u.team].some((v) => String(v || '').toLowerCase().includes(q)));
        }
        const suffix = [
          missingOnly ? '缺處別' : '',
          selectedTeamFilter ? selectedTeamFilter : '',
          q ? '搜尋「' + q + '」' : ''
        ].filter(Boolean).join(' · ');
        const status = document.getElementById('filter');
        document.getElementById('count').textContent =
          `共 ${list.length} 筆` + (suffix ? `（${suffix}）` : '') +
          (q && !list.length && status.value ? `；目前只查「${status.selectedOptions[0].text}」，篩選狀態改成「全部」可查所有帳號` : '');
        document.getElementById('rows').innerHTML = list.map((u) => {
          const missing = !String(u.team || '').trim();
          const teamHit = selectedTeamFilter && userTeamKey(u) === selectedTeamFilter;
          const acts = [];
          if (u.status === 'pending') {
            acts.push(`<button type="button" class="act-btn act-ok" data-act="active" data-id="${u.id}">核准</button>`);
            acts.push(`<button type="button" class="act-btn act-danger" data-act="rejected" data-id="${u.id}">拒絕</button>`);
          } else if (u.status === 'active') {
            acts.push(`<button type="button" class="act-btn act-warn" data-act="disabled" data-id="${u.id}">停用</button>`);
          } else if (u.status === 'disabled' || u.status === 'rejected') {
            acts.push(`<button type="button" class="act-btn act-ok" data-act="active" data-id="${u.id}">重新核准</button>`);
          }
          return `<tr class="${missing ? 'row-missing' : ''}${teamHit ? ' row-team-highlight' : ''}">
            <td>${esc(u.username) || '—'}${missing ? '<span class="badge-missing">缺處別</span>' : ''}${u.adminQaDoublePoints ? '<span class="badge-double">✓ 雙倍</span>' : ''}</td>
            <td>${esc(u.name) || '—'}</td>
            <td class="team-cell">
              ${teamSelectHtml(u.id, u.team || '')}
              <button type="button" class="act-btn act-save" data-act="save-team" data-id="${u.id}">儲存處別</button>
            </td>
            <td>
              <label class="qa-double-toggle">
                <input type="checkbox" data-act="toggle-double" data-id="${u.id}"${u.adminQaDoublePoints ? ' checked' : ''} />
                檢核雙倍點數
              </label>
            </td>
            <td>
              <label class="qa-double-toggle">
                <input type="checkbox" data-act="toggle-quality" data-id="${u.id}"${u.adminQaCanSetQuality ? ' checked' : ''} />
                可認定優質
              </label>
            </td>
            <td>${badge(u.status)}</td>
            <td>${fmt(u.createdAt)}</td>
            <td>${acts.join('') || '—'}</td>
          </tr>`;
        }).join('');
      }

      async function loadTeamStats() {
        const data = await rpc('toolbox_admin_list', { p_secret: secret, p_status: null });
        if (!data?.ok) throw new Error(data?.error || '讀取失敗');
        statsUsers = data.users || [];
        if (selectedTeamFilter && !usersForTeam(selectedTeamFilter).length) {
          selectedTeamFilter = null;
        }
        renderTeamStats(statsUsers);
        renderTeamDetail(selectedTeamFilter);
      }

      async function loadList() {
        const status = document.getElementById('filter').value;
        const [listData] = await Promise.all([
          rpc('toolbox_admin_list', { p_secret: secret, p_status: status || null }),
          loadTeamStats()
        ]);
        if (!listData?.ok) throw new Error(listData?.error || '讀取失敗');
        allUsers = listData.users || [];
        renderRows(allUsers);
        document.getElementById('msg').textContent = '';
      }

      async function setStatus(id, status) {
        const data = await rpc('toolbox_admin_set_status', {
          p_secret: secret,
          p_user_id: id,
          p_status: status,
          p_note: null
        });
        if (!data?.ok) throw new Error(data?.error || '更新失敗');
        await loadList();
      }

      async function saveTeam(id) {
        const sel = document.querySelector(`select[data-team-for="${id}"]`);
        const team = sel?.value?.trim() || '';
        if (!team) throw new Error('請先選擇處別');
        const data = await rpc('toolbox_admin_set_team', {
          p_secret: secret,
          p_user_id: id,
          p_team: team
        });
        if (!data?.ok) throw new Error(data?.error || '儲存失敗');
        document.getElementById('msg').textContent = '已更新處別：' + team;
        await loadList();
      }

      async function toggleDouble(id, enabled) {
        const data = await rpc('toolbox_admin_set_qa_double', {
          p_secret: secret,
          p_user_id: id,
          p_enabled: enabled
        });
        if (!data?.ok) throw new Error(data?.error || '更新失敗');
        document.getElementById('msg').textContent = enabled ? '已啟用 QA 雙倍點數' : '已關閉 QA 雙倍點數';
        await loadList();
      }

      async function toggleQuality(id, enabled) {
        const data = await rpc('toolbox_admin_set_qa_quality', {
          p_secret: secret,
          p_user_id: id,
          p_enabled: enabled
        });
        if (!data?.ok) throw new Error(data?.error || '更新失敗');
        document.getElementById('msg').textContent = enabled ? '已啟用 QA 優質認定' : '已關閉 QA 優質認定';
        await loadList();
      }

      document.getElementById('btn-login').addEventListener('click', async () => {
        secret = document.getElementById('admin-secret').value.trim();
        const msg = document.getElementById('login-msg');
        msg.classList.add('hidden');
        try {
          const data = await rpc('toolbox_admin_list', { p_secret: secret, p_status: 'pending' });
          if (!data?.ok) throw new Error(data?.error || '後台密碼錯誤');
          sessionStorage.setItem(SECRET_KEY, secret);
          document.getElementById('login-panel').classList.add('hidden');
          document.getElementById('main-panel').classList.remove('hidden');
          await loadList();
        } catch (e) {
          msg.textContent = e.message || '連線失敗';
          msg.classList.remove('hidden');
        }
      });

      document.getElementById('btn-refresh').addEventListener('click', () => loadList().catch((e) => {
        document.getElementById('msg').textContent = e.message;
      }));

      document.getElementById('filter').addEventListener('change', () => loadList().catch(() => {}));
      document.getElementById('filter-missing-team').addEventListener('change', () => renderRows(allUsers));
      document.getElementById('search').addEventListener('input', () => renderRows(allUsers));

      document.getElementById('team-stats-grid').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-team]');
        if (!btn || btn.disabled) return;
        setTeamFilter(btn.dataset.team);
      });

      document.getElementById('team-detail-clear').addEventListener('click', clearTeamFilter);

      document.getElementById('rows').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-act]');
        if (!btn) return;
        const id = btn.dataset.id;
        const msgEl = document.getElementById('msg');
        if (btn.dataset.act === 'save-team') {
          saveTeam(id).catch((err) => { msgEl.textContent = err.message; });
          return;
        }
        setStatus(id, btn.dataset.act).catch((err) => {
          msgEl.textContent = err.message;
        });
      });

      document.getElementById('rows').addEventListener('change', (e) => {
        const doubleCb = e.target.closest('[data-act="toggle-double"]');
        if (doubleCb) {
          toggleDouble(doubleCb.dataset.id, doubleCb.checked).catch((err) => {
            document.getElementById('msg').textContent = err.message;
            doubleCb.checked = !doubleCb.checked;
          });
          return;
        }
        const qualityCb = e.target.closest('[data-act="toggle-quality"]');
        if (qualityCb) {
          toggleQuality(qualityCb.dataset.id, qualityCb.checked).catch((err) => {
            document.getElementById('msg').textContent = err.message;
            qualityCb.checked = !qualityCb.checked;
          });
        }
      });

      const saved = sessionStorage.getItem(SECRET_KEY);
      if (saved) document.getElementById('admin-secret').value = saved;
    })();
  </script>
</body>
</html>
